# Source-pinned, one-time Android engine update. No APK rebuild, no clean/cache deletion.
# Runner waits for verified native build before touching signed updates branch.
name: Publish Project X offline impact FX fix (one time)
on:
  push:
    branches: [dev/mobile-v4]
    paths: [.github/workflows/publish-projectx-impact-fx-once.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: own-engine-update-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      PREFLIGHT_RUN: '38095432845'
      EXPECTED_BUILD_SOURCE: ${{ github.sha }}
      MIN_PUBLISHED_SEQ: '3446'
      EXPECTED_OLD_SOURCE: 'ddd29f34af1a28204a77a70f56379ce66e0d648c'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Verify exact one-time publication request and previous signed engine
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/dev/mobile-v4
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f scripts/qa/test-projectile-impact-shroud.py
          # Do not touch the updates channel until the immutable branch
          # has passed its real cached 30/60Hz native build.
          for ((n=1;n<=200;n++)); do
            check="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREFLIGHT_RUN" --jq '[.status, (.conclusion // "pending"), .head_sha] | join("|")')"
            if [[ "$check" == "completed|success|d1c03331cce603c231bb239f535f6c88c159dabc" ]]; then
              echo "PASS: independently verified Project X native preflight $PREFLIGHT_RUN"
              break
            fi
            if [[ "$check" == completed* ]]; then
              echo "::error::Project X native preflight not successful: $check. Preserve existing signed update."
              exit 1
            fi
            if [[ "$n" -eq 200 ]]; then
              echo "::error::Project X native preflight timed out. No update published."
              exit 1
            fi
            sleep 25
          done
          test "$(git show -s --format=%s HEAD)" = 'Merge pull request #14 from koreazolfakar-droid/fix/projectx-impact-visibility-20261011'
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev/mobile-v4" --jq '.object.sha')" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/contents/manifest.json?ref=updates" --jq '.content' | base64 --decode > "$RUNNER_TEMP/old-manifest.json"
          python3 - <<'PY'
          import json,os,pathlib
          m=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'old-manifest.json').read_text())
          assert m['engine']['seq']==3446 and m['serial']==11
          assert m['engine']['source_commit']==os.environ['EXPECTED_OLD_SOURCE']
          print('PASS: previous signed engine 3446 and manifest serial 11 verified')
          PY
      - name: Dispatch immutable cache-only Android 30Hz and 60Hz build
        shell: bash
        run: |
          set -euo pipefail
          prev="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-android.yml/runs?per_page=50&branch=dev%2Fmobile-v4&event=workflow_dispatch" --jq '[.workflow_runs[].id] | max // 0')"
          echo "PREVIOUS_ENGINE_RUN=$prev" >> "$GITHUB_ENV"
          gh workflow run build-android.yml --ref dev/mobile-v4 \
            -f engine_incremental_mode=build \
            -f source_ref="$GITHUB_SHA" \
            -f require_existing_caches=true
          echo "PASS: dispatched cached native dual-engine build without new APK"
      - name: Require exact-source native build success before download or signing
        shell: bash
        run: |
          set -euo pipefail
          for ((n=1;n<=260;n++)); do
            build_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-android.yml/runs?per_page=50&branch=dev%2Fmobile-v4&event=workflow_dispatch" --jq ".workflow_runs | map(select(.id > $PREVIOUS_ENGINE_RUN and .head_sha == \"$GITHUB_SHA\")) | max_by(.id).id // empty")"
            if [[ "$build_run" =~ ^[0-9]+$ ]]; then
              metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$build_run" --jq '[(.id | tostring), .status, (.conclusion // "pending"), .head_sha, .path, .head_repository.full_name] | join("|")')"
              echo "Project X impact native: $metadata"
              if [[ "$metadata" == "$build_run|completed|success|$GITHUB_SHA|.github/workflows/build-android.yml|$GITHUB_REPOSITORY" ]]; then
                echo "NATIVE_RUN_ID=$build_run" >> "$GITHUB_ENV"
                echo "PASS: exact-source dual-engine compilation successful"
                exit 0
              fi
              if [[ "$metadata" == "$build_run|completed|"* ]]; then
                echo "::error::Native engine build failed or wrong source; do not publish"
                exit 1
              fi
            fi
            sleep 30
          done
          echo "::error::Native build timeout; preserve previous signed update"
          exit 1
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EXPECTED_BUILD_SOURCE }}
          path: engine-source
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Confirm immutable impact source, regression checks and engine version
        working-directory: engine-source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BUILD_SOURCE"
          version="$(bash scripts/build/android/engine-build-number.sh "$PWD")"
          test "$version" -gt "$MIN_PUBLISHED_SEQ"
          echo "EXPECTED_BUILD_SEQ=$version" >> "$GITHUB_ENV"
          python3 scripts/qa/test-projectile-impact-shroud.py -v
          python3 scripts/qa/test-mobile-command-overflow.py
          python3 scripts/qa/test-mobile-all-faction-order-pages.py
          python3 scripts/qa/test-save-map-safety.py
          python3 scripts/qa/test-mod-localization.py
          echo "PASS: immutable offline Project X impact guards and engine $version"
      - uses: actions/download-artifact@v5
        with:
          name: engine-incremental-report
          run-id: ${{ env.NATIVE_RUN_ID }}
          github-token: ${{ github.token }}
          path: engine-source/engine-build
      - uses: actions/download-artifact@v5
        with:
          name: Bootstrap-1.4.3-Engine3333-debug.apk
          run-id: 37422581004
          github-token: ${{ github.token }}
          path: engine-source/bootstrap-baseline
      - name: Verify exact 30/60Hz engine hashes and unchanged APK runtime dependencies
        working-directory: engine-source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update/prepare-engine-run.py \
            --report-dir engine-build \
            --baseline-apk bootstrap-baseline/GeneralsZH-Bootstrap-1.4.3-Engine3333-debug.apk \
            --expected-source "$EXPECTED_BUILD_SOURCE" \
            --out prepared-update \
            --note 'Offline impact visibility: briefly reveal actual artillery and guided missile blast area for owner/allies before shroud-filtered impact FX, across faction-independent shared paths. No weapon stats or mod content changed. Multiplayer excluded for CRC compatibility. Special death-FX weapons, full Project X asset completeness, and on-device gameplay remain unverified.'
          python3 - <<'PY'
          import json,os
          m=json.load(open('prepared-update/manifest.json'))
          assert m['engine']['seq']==int(os.environ['EXPECTED_BUILD_SEQ'])
          assert m['engine']['source_commit']==os.environ['EXPECTED_BUILD_SOURCE']
          assert m['serial']>11
          assert {'libmain.so','libmain60.so'} <= set(m['engine']['files'])
          print('PASS: both prepared engine variants and increased serial',m['serial'])
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: projectx-impact-fx-prepared-engine-update
          path: engine-source/prepared-update/
          if-no-files-found: error
          retention-days: 90
      - name: Sign and verify exact manifest, trust root, and native engine binaries
        working-directory: engine-source
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: bash scripts/update/sign-manifest.sh prepared-update
      - name: Publish signed update to existing in-app updater channel
        working-directory: engine-source
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev/mobile-v4" --jq .object.sha)" = "$EXPECTED_BUILD_SOURCE"
          gh auth setup-git --hostname github.com
          bash scripts/update/push-updates-branch.sh prepared-update
      - name: Verify published signed manifest and both downloadable 30/60Hz engine binaries
        working-directory: engine-source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,hashlib,importlib.util,json,os,pathlib,subprocess,urllib.request
          spec=importlib.util.spec_from_file_location('artifacts','scripts/update/update-artifacts.py')
          a=importlib.util.module_from_spec(spec);spec.loader.exec_module(a)
          repo=os.environ['GITHUB_REPOSITORY']
          def api(path):return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/'+path]))
          head=api('git/ref/heads/updates')['object']['sha']
          folder=pathlib.Path('published-verification');folder.mkdir()
          for name in ('manifest.json','manifest.json.sig'):
              (folder/name).write_bytes(base64.b64decode(api(f'contents/{name}?ref={head}')['content']))
          m=a.verify_manifest(folder,'android/app/src/main/assets/update-public.pem')
          version=int(os.environ['EXPECTED_BUILD_SEQ'])
          assert m['engine']['seq']==version
          assert m['engine']['source_commit']==os.environ['EXPECTED_BUILD_SOURCE']
          assert m['serial']>11
          assert {'libmain.so','libmain60.so'}<=set(m['engine']['files'])
          for name in ('libmain.so','libmain60.so'):
              row=m['engine']['files'][name]
              url=row['url']
              assert url.startswith('https://raw.githubusercontent.com/'+repo+'/updates/engine/'+str(version)+'/')
              with urllib.request.urlopen(url,timeout=120) as response:
                  payload=gzip.decompress(response.read())
              assert len(payload)==row['size'] and hashlib.sha256(payload).hexdigest()==row['sha256']
              a.native_stamp(payload,os.environ['EXPECTED_BUILD_SOURCE'],version)
          print('PASS: published signed engine',version,'serial',m['serial'],'both downloadable binaries verified')
          PY
