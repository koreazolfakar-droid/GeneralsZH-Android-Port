name: Package launcher progress APK without native rebuild
on:
  push:
    branches: [main]
    paths: ['.github/workflows/package-launcher-progress-once.yml']
permissions:
  actions: read
  contents: write
concurrency:
  group: launcher-progress-1-4-6
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == 'koreazolfakar-droid/GeneralsZH-Android-Port'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_SHA: 8a820f5adb27eaade4e4b883044d487c738de188
      BASELINE_RUN: '37422581004'
      APK_NAME: GeneralsZH-LauncherProgress-v1.4.6-debug.apk
      VERSION_CODE: '10406'
      VERSION_NAME: '1.4.6'
      REPO: koreazolfakar-droid/GeneralsZH-Android-Port
    steps:
      - name: Guard the exact verified progress source and published engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPO/branches/dev/mobile-v4" --jq '.commit.sha')" = "$SOURCE_SHA"
          gh api "repos/$REPO/contents/manifest.json?ref=updates" --jq '.content' |
            base64 -d > "$RUNNER_TEMP/update-manifest.json"
          python3 - "$RUNNER_TEMP/update-manifest.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          assert j['engine']['seq']==3356
          assert j['engine']['source_commit']=='308153f6e1f3af1539d9211d15750027b4d1ba7c'
          print('PASS: published signed channel targets Engine 3356')
          PY
      - uses: actions/checkout@v6
        with:
          ref: 8a820f5adb27eaade4e4b883044d487c738de188
          fetch-depth: 1
          filter: blob:none
          submodules: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reuse previous Android SDK without installing native toolchain
        id: cache-sdk
        uses: actions/cache/restore@v5
        with:
          path: /opt/android-sdk
          key: android-sdk-13114758-ndk27.2.12479018-p35-bt35
      - name: Install shell-only Android SDK tools if not cached
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/android-cmdline.zip" https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          echo "5fdcc763663eefb86a5b8879697aa6088b041e70  $RUNNER_TEMP/android-cmdline.zip" | sha1sum -c -
          sudo mkdir -p /opt/android-sdk/cmdline-tools
          sudo unzip -q "$RUNNER_TEMP/android-cmdline.zip" -d /opt/android-sdk/cmdline-tools
          sudo mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          sudo chown -R "$USER":"$USER" /opt/android-sdk
          yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/download-artifact@v5
        with:
          name: Bootstrap-1.4.3-Engine3333-debug.apk
          run-id: 37422581004
          github-token: ${{ github.token }}
          path: retained-apk
      - name: Verify and reuse every exact baseline native library and packaged asset
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          a=pathlib.Path('retained-apk/GeneralsZH-Bootstrap-1.4.3-Engine3333-debug.apk')
          assert a.is_file(), 'verified baseline APK missing'
          expected=json.loads(pathlib.Path('.github/engine-baseline/bootstrap-native.json').read_text())['native_libraries']
          jni=pathlib.Path('android/app/src/main/jniLibs')
          assets=pathlib.Path('android/app/src/main/assets')
          names=set()
          with zipfile.ZipFile(a) as z:
              original_key=z.read('assets/update-public.pem')
              assert original_key==(assets/'update-public.pem').read_bytes(), 'Update trust key changed'
              assert z.read('assets/engine_build.txt').strip()==b'3333', 'Unexpected bundled engine'
              for info in z.infolist():
                  name=info.filename
                  if name.startswith('lib/arm64-v8a/') and name.endswith('.so'):
                      lib=name.rsplit('/',1)[-1]
                      data=z.read(info)
                      assert lib in expected and hashlib.sha256(data).hexdigest()==expected[lib]['sha256'],lib
                      dest=jni/'arm64-v8a'/lib
                      dest.parent.mkdir(parents=True,exist_ok=True)
                      dest.write_bytes(data)
                      names.add(lib)
                  if name.startswith('assets/') and not info.is_dir():
                      rel=pathlib.Path(name).relative_to('assets')
                      if str(rel)=='update-public.pem':
                          continue
                      dest=assets/rel
                      dest.parent.mkdir(parents=True,exist_ok=True)
                      dest.write_bytes(z.read(info))
          assert names==set(expected),sorted(set(expected)-names)
          print('PASS: pinned 3333 native binaries preserved byte-identically, both rates, update key unchanged')
          PY
      - name: Stage pinned SDL3 Java bridge, no native rebuild
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/SDL3.tar.gz" \
            https://github.com/libsdl-org/SDL/releases/download/release-3.4.2/SDL3-3.4.2.tar.gz
          echo "ef39a2e3f9a8a78296c40da701967dd1b0d0d6e267e483863ce70f8a03b4050c  $RUNNER_TEMP/SDL3.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/sdl-src"
          tar -xzf "$RUNNER_TEMP/SDL3.tar.gz" -C "$RUNNER_TEMP/sdl-src" --wildcards 'SDL3-3.4.2/android-project/app/src/main/java/org/libsdl/app/*'
          SRC="$RUNNER_TEMP/sdl-src/SDL3-3.4.2/android-project/app/src/main/java/org/libsdl/app"
          test -s "$SRC/SDLActivity.java"
          JAVA_DIR=android/app/src/main/java-sdl/org/libsdl/app
          mkdir -p "$JAVA_DIR"
          cp "$SRC/"*.java "$JAVA_DIR/"
          patch -p1 -d android/app/src/main/java-sdl < android/patches/sdl-android-gesture-nav-back.patch
          test -s "$JAVA_DIR/SDLActivity.java"
      - name: Package shell APK using Gradle only
        env:
          ANDROID_HOME: /opt/android-sdk
          ANDROID_SDK_ROOT: /opt/android-sdk
        run: |
          set -euo pipefail
          # Scratch-workspace-only packaging directive: no stripping or modifying exact pinned native binaries.
          cat >> android/app/build.gradle <<'EOF'
          android {
              packagingOptions {
                  jniLibs { keepDebugSymbols += ['**/*.so'] }
              }
          }
          EOF
          gradle -p android :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace \
            -PandroidVersionCode="$VERSION_CODE" -PandroidVersionName="$VERSION_NAME"
      - name: Audit native SHA, signed channel, APK signer and Android identity
        run: |
          set -euo pipefail
          mkdir -p final-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "final-apk/$APK_NAME"
          python3 - <<'PY'
          import zipfile,hashlib,json,pathlib
          apk=pathlib.Path('final-apk')/__import__('os').environ['APK_NAME']
          baseline=pathlib.Path('retained-apk/GeneralsZH-Bootstrap-1.4.3-Engine3333-debug.apk')
          expected=json.loads(pathlib.Path('.github/engine-baseline/bootstrap-native.json').read_text())['native_libraries']
          with zipfile.ZipFile(apk) as built,zipfile.ZipFile(baseline) as old:
              libs={n.rsplit('/',1)[-1] for n in built.namelist() if n.startswith('lib/arm64-v8a/') and n.endswith('.so')}
              assert libs==set(expected), 'Native library set differs from 3333 baseline'
              for lib,record in expected.items():
                  name='lib/arm64-v8a/'+lib
                  assert hashlib.sha256(built.read(name)).hexdigest()==record['sha256'],lib
              assert built.read('assets/engine_build.txt').strip()==b'3333'
              assert built.read('assets/update-public.pem')==old.read('assets/update-public.pem')
              assert built.read('classes.dex')!=old.read('classes.dex'), 'Launcher classes did not change'
          print('PASS: all 17 pinned native SHA-256 values remain byte-identical')
          PY
          APK="final-apk/$APK_NAME"
          /opt/android-sdk/build-tools/35.0.0/apksigner verify --print-certs "$APK" > /tmp/new-signer.txt
          /opt/android-sdk/build-tools/35.0.0/apksigner verify --print-certs retained-apk/GeneralsZH-Bootstrap-1.4.3-Engine3333-debug.apk > /tmp/old-signer.txt
          old="$(grep 'Signer #1 certificate SHA-256 digest:' /tmp/old-signer.txt | head -1 | cut -d: -f2 | tr -d ' ')"
          new="$(grep 'Signer #1 certificate SHA-256 digest:' /tmp/new-signer.txt | head -1 | cut -d: -f2 | tr -d ' ')"
          test -n "$old" && test "$old" = "$new"
          /opt/android-sdk/build-tools/35.0.0/aapt dump badging "$APK" | head -1 | tee /tmp/apk-package.txt
          grep -q "name='com.generalsx.zerohour'" /tmp/apk-package.txt
          grep -q "versionCode='10406'" /tmp/apk-package.txt
          echo "PASS: same signing identity, higher Android version code, same app package"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v7
        with:
          name: GeneralsZH-LauncherProgress-v1.4.6-debug
          path: final-apk/*.apk
          retention-days: 90
          if-no-files-found: error
      - name: Publish opt-in compatible APK separately from engine updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v1.4.6-launcher-progress
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::Release tag already exists; refusing overwrite."
            exit 1
          fi
          cat > "$RUNNER_TEMP/release-notes.txt" <<'EOF'
          Android launcher 1.4.6 — engine update progress UI.
          - Shows real compressed download bytes, file index, verify/install stage, and persistent failure/retry messages.
          - Keeps the exact previously verified 3333 built-in engines and all original native dependencies.
          - Preserves the pinned update trust root; after installation, select Check for updates to download published Engine 3356.
          - Compatible installer identity verified against the existing 1.4.3 bootstrap APK.
          - Android hardware testing and Project X gameplay still require testing on device.
          - No game data or mods are bundled. Install over the existing app; do not clear app data.
          EOF
          gh release create "$TAG" "final-apk/$APK_NAME" --repo "$REPO" \
            --target "$SOURCE_SHA" --title "Android Launcher 1.4.6 — Update Progress" \
            --notes-file "$RUNNER_TEMP/release-notes.txt" --latest=false
