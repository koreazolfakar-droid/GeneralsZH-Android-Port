name: Publish verified Bootstrap APK without rebuilding
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Bootstrap-1.4.3-Engine3333-debug.apk
          run-id: 37422581004
          github-token: ${{ github.token }}
          path: input
      - uses: actions/download-artifact@v5
        with:
          name: bootstrap-3333-verification
          run-id: 37422581004
          github-token: ${{ github.token }}
          path: reports
      - name: Verify the existing APK and publish its download; no build or engine update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYREPORT'
          import pathlib,json,hashlib,shutil
          r=list(pathlib.Path('reports').rglob('bootstrap-verification.json'));assert len(r)==1
          report=json.loads(r[0].read_text())
          apk=pathlib.Path('input')/report['apk_filename']
          assert report['engine_build']==3333 and report['launcher_source_commit']=='054b0a3cf6dbe0ddcd132ec5e33abb9d0507e45f'
          assert len(report['native_libraries'])==17 and all(row['result']=='MATCH' for row in report['native_libraries'])
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==report['apk_sha256']=='d6eb3862e5b87672488b4cabc39414d99871a29651f045fc8be2f61747234125'
          shutil.copyfile(r[0],'bootstrap-verification.json')
          m=list(pathlib.Path('reports').rglob('native-comparison.md'));assert len(m)==1
          shutil.copyfile(m[0],'native-comparison.md')
          PYREPORT
          cat > release-notes.md <<'NOTES'
          Bootstrap launcher update from dev/mobile-v4 commit 054b0a3cf6dbe0ddcd132ec5e33abb9d0507e45f.

          App version: 1.4.3-bootstrap-debug (10403). Engine: 3333, unchanged.
          Packaging only: all 17 native libraries are byte-identical to the verified 1.4.2 Engine3333 APK; no native engine or dependency was rebuilt.
          Uses our repository update channel and our public ECDSA P-256 key. No private update signing key is in the APK.
          Same applicationId and APK signing certificate; install over the current app using adb install -r. Do not uninstall or clear application data.
          35 Android/JVM tests and update/security/source checks passed. Real device: NOT TESTED.
          Engine3334 was not published. Compatible signed engine-only updates can be activated after installing this bootstrap without another APK.
          APK SHA-256: d6eb3862e5b87672488b4cabc39414d99871a29651f045fc8be2f61747234125
          NOTES
          gh release create bootstrap-1.4.3-engine3333 input/GeneralsZH-Bootstrap-1.4.3-Engine3333-debug.apk native-comparison.md bootstrap-verification.json --repo koreazolfakar-droid/GeneralsZH-Android-Port --target 054b0a3cf6dbe0ddcd132ec5e33abb9d0507e45f --prerelease --title 'Bootstrap 1.4.3 — Engine3333 unchanged' --notes-file release-notes.md
