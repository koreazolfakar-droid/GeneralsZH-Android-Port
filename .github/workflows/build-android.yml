name: Package Bootstrap using verified Engine 3333 APK
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASELINE_APK: input/GeneralsXZH-android-run8.apk
      APK_NAME: GeneralsZH-Bootstrap-1.4.3-Engine3333-debug.apk
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 054b0a3cf6dbe0ddcd132ec5e33abb9d0507e45f
          fetch-depth: 0
          filter: blob:none
      - name: Use preinstalled JDK and Android packaging tools only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 054b0a3cf6dbe0ddcd132ec5e33abb9d0507e45f
          test -x "$JAVA_HOME_17_X64/bin/javac"
          SDK_PATH="${ANDROID_HOME:?Preinstalled Android SDK required}"
          test -f "$SDK_PATH/platforms/android-35/android.jar"
          test -x "$SDK_PATH/build-tools/35.0.0/aapt2"
          test -x "$SDK_PATH/build-tools/35.0.0/zipalign"
          test -f "$SDK_PATH/build-tools/35.0.0/lib/apksigner.jar"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_SDK_TOOLS=$SDK_PATH/build-tools/35.0.0" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v5
        with:
          name: GeneralsXZH-android-run8.apk
          run-id: 37412214201
          github-token: ${{ github.token }}
          path: input
      - name: Verify baseline and stage its exact native libraries and runtime assets
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/verify-bootstrap.py" <<'PYBOOT'
          #!/usr/bin/env python3
          """Stage and verify a launcher-only bootstrap against the pinned verified APK.
          Never builds, relinks, strips, replaces or regenerates any native payload.
          """
          import argparse, hashlib, importlib.util, json, os, pathlib, re, struct, subprocess, zipfile
          
          ROOT = pathlib.Path.cwd()
          SOURCE = '054b0a3cf6dbe0ddcd132ec5e33abb9d0507e45f'
          NATIVE_SOURCE = 'c3043dcfb89570351ca33adfa786bcede8532843'
          BASELINE_SHA = 'c6ba07ccca6ca10b3b5489c5ca12bdd0435608a75efcb633432dd284a4a24cbd'
          PUBLIC_SHA = 'fc0837a9f148f4dcf007fedb6409872769d9cc8a566d5c9e71d8d8522419bd81'
          CERT_SHA = '644a3b0f8234c6ea8960ece9b55a161c00966b8dd522d2558d84883f4f77c48e'
          LIBS = {'libmain.so','libmain60.so','libSDL3.so','libSDL3_image.so','libopenal.so',
          'libgamespy.so','libadrenotools.so','libmain_hook.so','libfile_redirect_hook.so',
          'libgsl_alloc_hook.so','libhook_impl.so','libdxvk_d3d8.so','libdxvk_d3d9.so',
          'libc++_shared.so','libEGL_angle.so','libGLESv2_angle.so','libVkLayer_khronos_validation.so'}
          spec = importlib.util.spec_from_file_location('update_artifacts', ROOT/'scripts/update/update-artifacts.py')
          a = importlib.util.module_from_spec(spec); spec.loader.exec_module(a)
          
          def need(value, message):
              if not value: raise ValueError(message)
          
          def command(*args):
              return subprocess.check_output(list(map(str,args)), text=True, stderr=subprocess.STDOUT)
          
          def metadata(apk, tools):
              badging = command(tools/'aapt2','dump','badging',apk)
              m = re.search(r"package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'",badging)
              need(m is not None and 'application-debuggable' in badging, 'Not a valid Debug APK')
              cert = command('java','-jar',tools/'lib/apksigner.jar','verify','--verbose','--print-certs',apk)
              certs = re.findall(r'Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F]+)',cert)
              need(certs == [CERT_SHA], 'APK signer changed')
              command(tools/'zipalign','-c','4',apk)
              return {'application_id':m[1],'version_code':int(m[2]),'version_name':m[3], 'signer_sha256':certs[0]}
          
          def asset_map(apk):
              with zipfile.ZipFile(apk) as z:
                  return {name:z.read(name) for name in z.namelist() if name.startswith('assets/') and not name.endswith('/')}
          
          def table(rows, destination):
              lines=['| Library | Old APK SHA-256 | Bootstrap APK SHA-256 | Result |',
                     '|---|---|---|---|']
              for row in rows: lines.append('| '+row['library']+' | '+row['old_apk_sha256']+' | '+(row.get('bootstrap_apk_sha256') or 'PENDING')+' | '+row['result']+' |')
              destination.write_text('\n'.join(lines)+'\n')
          
          def main():
              p=argparse.ArgumentParser();p.add_argument('--baseline',type=pathlib.Path,required=True)
              p.add_argument('--apk',type=pathlib.Path);p.add_argument('--tools',type=pathlib.Path)
              p.add_argument('--stage',action='store_true');p.add_argument('--output',type=pathlib.Path,required=True)
              args=p.parse_args();args.output.mkdir(parents=True,exist_ok=True)
              need(command('git','rev-parse','HEAD').strip()==SOURCE,'Launcher checkout changed')
              need(a.digest(args.baseline.read_bytes())==BASELINE_SHA,'Missing exact verified 1.4.2 APK')
              seq,commit,old=a.apk_payload(args.baseline)
              need(seq==3333 and commit==NATIVE_SOURCE and set(old)==LIBS,'Baseline engine/library identity differs')
              for name,data in old.items():
                  need(data[:6]==b'\x7fELF\x02\x01' and struct.unpack_from('<H',data,18)[0]==183,'Non-AArch64 native library: '+name)
              key=ROOT/'android/app/src/main/assets/update-public.pem'
              der=a.public_der(key);need(a.digest(der)==PUBLIC_SHA,'Pinned public identity changed')
              # A packaging-only bootstrap does not change any existing mod/save/online source.
              preserved=['android/app/src/main/java/com/generalsx/zerohour/ModManager.java',
                         'android/app/src/main/java/com/generalsx/zerohour/ModManagerActivity.java',
                         'android/app/src/main/java/com/generalsx/zerohour/ModImportService.java',
                         'GeneralsMD/Code/GameEngine/Source/GameNetwork/GeneralsOnline/NetworkMesh.cpp']
              for path in preserved:
                  need(not command('git','diff',NATIVE_SOURCE,SOURCE,'--',path).strip(),'Preserved source changed: '+path)
              rows=[{'library':name,'old_apk_sha256':a.digest(data),'bootstrap_apk_sha256':None,'result':'PENDING'} for name,data in sorted(old.items())]
              assets=asset_map(args.baseline)
              if args.stage:
                  native=ROOT/'android/app/src/main/jniLibs/arm64-v8a'
                  native.mkdir(parents=True,exist_ok=True)
                  need(not list(native.glob('*.so')),'Refuse to overwrite previously staged native libraries')
                  for name,data in old.items():
                      (native/name).write_bytes(data)
                      need((native/name).read_bytes()==data,'Extraction altered '+name)
                  for name,data in assets.items():
                      relative=pathlib.PurePosixPath(name).relative_to('assets')
                      need('..' not in relative.parts,'Invalid baseline asset path')
                      dst=ROOT/'android/app/src/main/assets'/relative
                      dst.parent.mkdir(parents=True,exist_ok=True)
                      if dst.exists(): need(dst.read_bytes()==data,'Committed runtime asset differs: '+name)
                      else: dst.write_bytes(data)
                  (args.output/'native-comparison-before.json').write_text(json.dumps(rows,indent=2)+'\n')
                  table(rows,args.output/'native-comparison-before.md')
                  print('PASS: staged all 17 verified native libraries and all baseline runtime assets without native compilation')
              if args.tools:
                  oldmeta=metadata(args.baseline,args.tools)
                  need(oldmeta['application_id']=='com.generalsx.zerohour' and oldmeta['version_code']==10402 and oldmeta['version_name']=='1.4.2-merged-engine-debug','Unexpected baseline APK version')
              if not args.apk: return
              need(args.apk.resolve()!=args.baseline.resolve(),'Baseline APK must remain separate')
              newseq,newcommit,new=a.apk_payload(args.apk)
              need(newseq==seq and newcommit==commit and set(new)==set(old),'Bootstrap changed engine provenance/library set')
              for row in rows:
                  name=row['library'];row['bootstrap_apk_sha256']=a.digest(new[name])
                  row['result']='MATCH' if new[name]==old[name] else 'MISMATCH'
              (args.output/'native-comparison.json').write_text(json.dumps(rows,indent=2)+'\n')
              table(rows,args.output/'native-comparison.md')
              need(all(row['result']=='MATCH' for row in rows),'Native byte mismatch')
              newassets=asset_map(args.apk)
              need(set(newassets)==set(assets)|{'assets/update-public.pem'},'Unexpected added/removed runtime assets')
              for name,data in assets.items():need(newassets[name]==data,'Baseline asset changed: '+name)
              need(newassets['assets/update-public.pem']==key.read_bytes(),'Public asset differs from committed identity')
              need(not any(b'PRIVATE KEY-----' in data for name,data in newassets.items() if name.endswith('.pem')),'Private PEM found')
              with zipfile.ZipFile(args.apk) as z:
                  dex=b'\n'.join(z.read(n) for n in z.namelist() if re.fullmatch(r'classes\d*\.dex',n))
                  for value in [a.BASE_URL.encode(),b'update-public.pem',b'gx_update_own_v1',b'engine_own_v1',
                                b'Lcom/generalsx/zerohour/UpdateTrust;',b'Lcom/generalsx/zerohour/ModManager;',
                                b'Lcom/generalsx/zerohour/ModManagerActivity;']:
                      need(value in dex,'Missing launcher/update/mod DEX marker: '+str(value))
                  import base64
                  need(base64.b64encode(a.UPSTREAM_PUBLIC_DER) not in dex,'Upstream signing key still embedded')
                  dex_changes=[]
                  with zipfile.ZipFile(args.baseline) as bz:
                      for name in z.namelist():
                          if re.fullmatch(r'classes\d*\.dex',name):
                              dex_changes.append(name not in bz.namelist() or z.read(name)!=bz.read(name))
                  need(any(dex_changes),'Old launcher DEX was reused')
              need(args.tools is not None,'SDK tools required for final APK verification')
              newmeta=metadata(args.apk,args.tools)
              need(newmeta['application_id']==oldmeta['application_id'] and newmeta['version_code']==10403 and newmeta['version_name']=='1.4.3-bootstrap-debug','Bootstrap identity/version differs')
              report={'apk_filename':args.apk.name,'apk_size':args.apk.stat().st_size,'apk_sha256':a.digest(args.apk.read_bytes()),
                      **newmeta,'launcher_source_commit':SOURCE,'native_source_commit':commit,'engine_build':seq,
                      'build_type':'PACKAGING ONLY; launcher Java/resources compiled; ZERO Android native compilation',
                      'native_library_count':len(rows),'native_libraries':rows,'baseline_runtime_assets_byte_identical':True,
                      'public_key_spki_sha256':PUBLIC_SHA,'update_base_url':a.BASE_URL,'upstream_trust_removed':True,
                      'mod_manager_dex_present':True,'save_turn_engine_bytes_preserved':True,'device_tests':'NOT TESTED',
                      'engine_3334_published':False}
              payload=args.apk.read_bytes();parts=[]
              for index,offset in enumerate(range(0,len(payload),24*1024*1024)):
                  path=args.output/f'apk.part{index:02d}';path.write_bytes(payload[offset:offset+24*1024*1024])
                  parts.append({'name':path.name,'size':path.stat().st_size,'sha256':a.digest(path.read_bytes())})
              report['parts']=parts
              (args.output/'bootstrap-verification.json').write_text(json.dumps(report,indent=2)+'\n')
              print(json.dumps(report,indent=2))
          
          if __name__=='__main__':main()
          PYBOOT
          python3 "$RUNNER_TEMP/verify-bootstrap.py" --baseline "$BASELINE_APK" --stage --tools "$BOOTSTRAP_SDK_TOOLS" --output export
          mkdir -p ../artifacts/engine-3277-merged
          cp "$BASELINE_APK" ../artifacts/engine-3277-merged/GeneralsZH-Engine3333-debug.apk
      - name: Test security, update channel and existing source compatibility
        shell: bash
        run: |
          set -euo pipefail
          javac -version
          python3 scripts/qa/test-own-update-channel.py
          python3 scripts/qa/test-engine-build-number.py
          python3 scripts/qa/test-engine-native-version.py
          python3 scripts/qa/test-engine-packaging.py
          python3 scripts/qa/test-save-map-safety.py
          python3 scripts/qa/test-engine-3277-hotfix.py
          python3 scripts/qa/test-mod-localization.py
          python3 scripts/qa/test-android-validation-staging.py
      - name: Stage matching SDL Java source only; never compile SDL native code
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff c3043dcfb89570351ca33adfa786bcede8532843 HEAD -- cmake/sdl3.cmake android/patches)"
          curl --fail --location --retry 2 https://github.com/libsdl-org/SDL/releases/download/release-3.4.2/SDL3-3.4.2.tar.gz --output "$RUNNER_TEMP/SDL3-3.4.2.tar.gz"
          echo "ef39a2e3f9a8a78296c40da701967dd1b0d0d6e267e483863ce70f8a03b4050c  $RUNNER_TEMP/SDL3-3.4.2.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/sdl-java" android/app/src/main/java-sdl/org/libsdl/app
          tar -xzf "$RUNNER_TEMP/SDL3-3.4.2.tar.gz" -C "$RUNNER_TEMP/sdl-java" --wildcards 'SDL3-3.4.2/android-project/app/src/main/java/org/libsdl/app/*.java'
          cp "$RUNNER_TEMP/sdl-java/SDL3-3.4.2/android-project/app/src/main/java/org/libsdl/app/"*.java android/app/src/main/java-sdl/org/libsdl/app/
          for file in android/patches/*.patch; do
            test -f "$file" || continue
            patch -p1 -d android/app/src/main/java-sdl < "$file"
          done
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
      - name: Package Java launcher only with all native bytes retained
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/bootstrap-packaging.gradle" <<'GROOVY'
          allprojects {
              plugins.withId('com.android.application') {
                  android.buildToolsVersion = '35.0.0'
                  android.packagingOptions.jniLibs.keepDebugSymbols.add('**/*.so')
              }
          }
          GROOVY
          cd android
          gradle --no-daemon --console=plain --init-script "$RUNNER_TEMP/bootstrap-packaging.gradle" -Pandroid.builder.sdkDownload=false -PandroidVersionCode=10403 -PandroidVersionName=1.4.3-bootstrap-debug :app:assembleDebug :app:testDebugUnitTest --dry-run > ../export/gradle-task-plan.txt
          if grep -E 'externalNativeBuild|configureCMake|buildCMake|ndkBuild|configureNdkBuild|buildNdkBuild' ../export/gradle-task-plan.txt; then
            echo 'ERROR: Native build task in packaging graph; refusing to execute.' >&2
            exit 1
          fi
          gradle --no-daemon --console=plain --stacktrace --init-script "$RUNNER_TEMP/bootstrap-packaging.gradle" -Pandroid.builder.sdkDownload=false -PandroidVersionCode=10403 -PandroidVersionName=1.4.3-bootstrap-debug :app:assembleDebug :app:testDebugUnitTest 2>&1 | tee ../export/gradle-packaging.log
      - name: Verify every native library, trust identity, app signature and engine provenance
        shell: bash
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk "export/$APK_NAME"
          python3 "$RUNNER_TEMP/verify-bootstrap.py" --baseline "$BASELINE_APK" --apk "export/$APK_NAME" --tools "$BOOTSTRAP_SDK_TOOLS" --output export
          git diff --exit-code
      - uses: actions/upload-artifact@v7
        with:
          name: Bootstrap-1.4.3-Engine3333-debug.apk
          path: export/GeneralsZH-Bootstrap-1.4.3-Engine3333-debug.apk
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bootstrap-3333-verification
          path: |
            export/*.json
            export/*.md
            export/*.log
            export/gradle-task-plan.txt
            android/app/build/test-results/testDebugUnitTest/*.xml
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: bootstrap-3333-part00
          path: export/apk.part00
          retention-days: 30
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: bootstrap-3333-part01
          path: export/apk.part01
          retention-days: 30
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: bootstrap-3333-part02
          path: export/apk.part02
          retention-days: 30
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: bootstrap-3333-part03
          path: export/apk.part03
          retention-days: 30
          if-no-files-found: ignore
