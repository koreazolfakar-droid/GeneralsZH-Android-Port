name: Test own update source without APK build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 6641f615b763d600f8c73fb38966c68e2c536650
          fetch-depth: 0
          filter: blob:none
      - name: Test production Java trust, signing and publisher
        run: |
          set -euo pipefail
          javac -version
          python3 scripts/qa/test-own-update-channel.py
          python3 scripts/qa/test-engine-build-number.py
          python3 scripts/qa/test-engine-packaging.py
          python3 scripts/qa/test-save-map-safety.py
          python3 scripts/qa/test-engine-3277-hotfix.py
