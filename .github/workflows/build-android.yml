  engine-report-diagnostics:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.engine_report_run != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: engine-incremental-report
          run-id: ${{ inputs.engine_report_run }}
          github-token: ${{ github.token }}
          path: report
      - name: Print retained plan evidence without any compilation
        run: |
          python3 - <<'PY_DIAG'
          import pathlib,json,collections
          root=pathlib.Path('report')
          print((root/'result.json').read_text())
          for path in root.glob('*explain.txt'):
              lines=path.read_text().splitlines()
              print('EXPLAIN',path.name,len(lines))
              reasons=[line for line in lines if 'explain:' in line]
              print('REASONS',len(reasons))
              print('\n'.join(reasons[:100]))
              print('TAIL\n'+'\n'.join(lines[-80:]))
              print(collections.Counter(line.split(' for ')[0] for line in lines if 'explain:' in line))
          for path in root.glob('*plan.txt'):
              print('PLAN',path.name)
              print('\n'.join(path.read_text().splitlines()[:12]))
          PY_DIAG
