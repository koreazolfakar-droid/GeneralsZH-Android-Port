name: Export verified limited engine baseline results
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  export-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download completed engine build report without compiling
        uses: actions/download-artifact@v5
        with:
          name: limited-engine-baseline-054b0a3cf6dbe0ddcd132ec5e33abb9d0507e45f
          run-id: 37469801143
          github-token: ${{ github.token }}
          path: verified
      - name: Separate audit evidence from native outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,tarfile
          p=pathlib.Path('verified')
          r=json.loads((p/'result.json').read_text())
          assert r['build']=='PASS' and r['dependency_compatibility']=='PASS'
          assert r['source_head']=='054b0a3cf6dbe0ddcd132ec5e33abb9d0507e45f'
          for rate,name in [('30','libmain.so'),('60','libmain60.so')]:
              assert hashlib.file_digest((p/name).open('rb'),'sha256').hexdigest()==r['variants'][rate]['sha256']
          with tarfile.open('audit-evidence.tar.gz','w:gz') as t:
              for item in p.iterdir():
                  if item.name not in ('libmain.so','libmain60.so','runtime-comparison'):
                      t.add(item,arcname=item.name)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: engine-3336-30hz
          path: verified/libmain.so
          retention-days: 30
          compression-level: 9
      - uses: actions/upload-artifact@v7
        with:
          name: engine-3336-60hz
          path: verified/libmain60.so
          retention-days: 30
          compression-level: 9
      - uses: actions/upload-artifact@v7
        with:
          name: engine-3336-audit-evidence
          path: audit-evidence.tar.gz
          retention-days: 30
          compression-level: 0
