name: Prepare verified Engine 3336 without rebuilding
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev/mobile-v4
          fetch-depth: 0
          filter: blob:none
          clean: false
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: limited-engine-baseline-054b0a3cf6dbe0ddcd132ec5e33abb9d0507e45f
          run-id: 37469801143
          github-token: ${{ github.token }}
          path: verified-engine
      - uses: actions/download-artifact@v5
        with:
          name: Bootstrap-1.4.3-Engine3333-debug.apk
          run-id: 37422581004
          github-token: ${{ github.token }}
          path: verified-bootstrap
      - name: Verify actual retained files before preparing publication
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('.')
          r=json.loads((root/'verified-engine/result.json').read_text())
          assert r['build']=='PASS' and r['dependency_compatibility']=='PASS' and not r['new_apk_required']
          assert r['source_head']=='054b0a3cf6dbe0ddcd132ec5e33abb9d0507e45f' and r['resolved_engine_sequence']==3336
          apk=root/'verified-bootstrap/GeneralsZH-Bootstrap-1.4.3-Engine3333-debug.apk'
          assert hashlib.file_digest(apk.open('rb'),'sha256').hexdigest()=='d6eb3862e5b87672488b4cabc39414d99871a29651f045fc8be2f61747234125'
          with zipfile.ZipFile(apk) as z:
              assert z.read('assets/update-public.pem')==(root/'android/app/src/main/assets/update-public.pem').read_bytes()
              assert int(z.read('assets/engine_build.txt'))==3333
              for row in r['dependency_comparison']:
                  digest=hashlib.sha256(z.read('lib/arm64-v8a/'+row['library'])).hexdigest()
                  assert row['match'] and row['sha256']==row['bootstrap_sha256']==digest
          for rate,name in [('30','libmain.so'),('60','libmain60.so')]:
              assert hashlib.file_digest((root/'verified-engine'/name).open('rb'),'sha256').hexdigest()==r['variants'][rate]['sha256']
              assert r['variants'][rate]['simulation_hz']==int(rate)
          print('PASS: exact verified 30/60 Hz Engine3336 and Bootstrap dependencies; no build required')
          PY
          python3 scripts/update/publish-update.py \
            --engine-dir verified-engine \
            --baseline-apk verified-bootstrap/GeneralsZH-Bootstrap-1.4.3-Engine3333-debug.apk \
            --source-commit 054b0a3cf6dbe0ddcd132ec5e33abb9d0507e45f \
            --out prepared-update \
            --note 'Verified Engine 3336, 30/60 Hz. Independent signed update channel; unchanged Bootstrap dependencies and game simulation.'
      - uses: actions/upload-artifact@v7
        with:
          name: prepared-engine-update
          path: prepared-update/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
