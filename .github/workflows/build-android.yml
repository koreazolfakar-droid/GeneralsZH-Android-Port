name: Publish verified Engine 3333 APK
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: GeneralsXZH-android-run8.apk
          run-id: 37412214201
          github-token: ${{ github.token }}
          path: input
      - name: Verify and publish existing APK without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp input/GeneralsXZH-android-run8.apk GeneralsZH-Engine3333-debug.apk
          echo 'c6ba07ccca6ca10b3b5489c5ca12bdd0435608a75efcb633432dd284a4a24cbd  GeneralsZH-Engine3333-debug.apk' | sha256sum -c -
          gh release create engine-3333-debug GeneralsZH-Engine3333-debug.apk --repo koreazolfakar-droid/GeneralsZH-Android-Port --target c3043dcfb89570351ca33adfa786bcede8532843 --prerelease --title 'Engine 3333 Debug APK' --notes 'Verified APK built from dev/mobile-v4 commit c3043dcfb89570351ca33adfa786bcede8532843. Engine Build 3333. APK SHA-256: c6ba07ccca6ca10b3b5489c5ca12bdd0435608a75efcb633432dd284a4a24cbd. Real-device Save/Online tests: NOT TESTED. Install as an in-place update and preserve app data.'
