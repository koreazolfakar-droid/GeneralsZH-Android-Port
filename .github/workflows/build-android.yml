          fetch-depth: 0
          filter: blob:none
          clean: false
          persist-credentials: false
      - name: Restore exact SDK cache used by Engine 3333
        uses: actions/cache/restore@v5
        id: recovery-sdk
        with:
          path: /opt/android-sdk
