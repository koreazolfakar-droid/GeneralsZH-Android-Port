name: Audit own update signing identity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-key:
    runs-on: ubuntu-latest
    steps:
      - name: Derive public identity only
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir public-identity
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo 'MISSING' > public-identity/status.txt
            echo 'UPDATE_SIGNING_KEY is not configured; no key was generated or replaced.'
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/update-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          openssl pkey -in "$key" -check -noout >/dev/null
          openssl pkey -in "$key" -pubout -out public-identity/update-public.pem
          openssl pkey -pubin -in public-identity/update-public.pem -text -noout | grep -q 'prime256v1'
          openssl pkey -pubin -in public-identity/update-public.pem -outform DER | base64 -w0 > public-identity/update-public.b64
          echo >> public-identity/update-public.b64
          echo 'PRESENT' > public-identity/status.txt
      - uses: actions/upload-artifact@v7
        with:
          name: own-update-public-identity
          path: public-identity/
          retention-days: 7
