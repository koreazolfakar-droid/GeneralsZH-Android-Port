name: Verify and export merged mobile APK
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c3043dcfb89570351ca33adfa786bcede8532843
          fetch-depth: 0
          filter: blob:none
      - uses: actions/download-artifact@v5
        with:
          name: GeneralsXZH-android-run8.apk
          run-id: 37412214201
          github-token: ${{ github.token }}
          path: input
      - name: Verify native source stamps and export unchanged APK bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYVERIFY'
          #!/usr/bin/env python3
          """Independently verify an actual merged Debug APK; never builds or installs it.
          
          The expected manifest must come from packaging/build artifacts. Source metadata
          is also checked inside both ELF engines, rather than trusting the APK label alone.
          Device launch, save persistence and online play are outside this artifact check.
          """
          import argparse
          import hashlib
          import json
          from pathlib import Path
          import re
          import struct
          import subprocess
          import sys
          import tempfile
          import zipfile
          
          
          REQUIRED_LIBRARIES = {
              'libmain.so', 'libmain60.so', 'libSDL3.so', 'libSDL3_image.so', 'libopenal.so',
              'libgamespy.so', 'libadrenotools.so', 'libmain_hook.so', 'libfile_redirect_hook.so',
              'libgsl_alloc_hook.so', 'libhook_impl.so', 'libdxvk_d3d8.so', 'libdxvk_d3d9.so',
              'libc++_shared.so', 'libEGL_angle.so', 'libGLESv2_angle.so',
              'libVkLayer_khronos_validation.so',
          }
          SYSTEM_LIBRARIES = {
              'libc.so', 'libm.so', 'libdl.so', 'liblog.so', 'libandroid.so', 'libvulkan.so',
              'libEGL.so', 'libGLESv1_CM.so', 'libGLESv2.so', 'libGLESv3.so', 'libOpenSLES.so',
              'libaaudio.so', 'libz.so', 'libjnigraphics.so', 'libnativewindow.so', 'libmediandk.so',
              'libcamera2ndk.so', 'libsync.so',
          }
          NATIVE_MARKERS = (
              b'gx_gles_gputimer.txt',
              b'off (gx_gles_gputimer.txt turns it on)',
              b'stun:stun.playgenerals.online:3478,stun:stun.l.google.com:19302,stun:stun.playgenerals.online:53',
              b'turn:turn.playgenerals.online:3478,turn:turn.playgenerals.online:53',
          )
          
          
          def require(condition, message):
              if not condition:
                  raise ValueError(message)
          
          
          def sha256(path):
              digest = hashlib.sha256()
              with path.open('rb') as source:
                  for chunk in iter(lambda: source.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()
          
          
          def capture(command):
              return subprocess.check_output([str(part) for part in command], text=True,
                                             stderr=subprocess.STDOUT)
          
          
          def signer(apk, sdk):
              result = capture(['java', '-jar', sdk / 'lib/apksigner.jar',
                                'verify', '--verbose', '--print-certs', apk])
              matches = re.findall(r'Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F]+)', result)
              require(len(matches) == 1, 'APK must have exactly one verified signer')
              return matches[0].lower()
          
          
          def identity(apk, sdk):
              result = capture([sdk / 'aapt2', 'dump', 'badging', apk])
              match = re.search(r"package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'", result)
              require(match is not None, 'APK package/version metadata missing')
              package, code, version = match.groups()
              require("application-debuggable" in result, 'Generated APK is not a Debug APK')
              return package, int(code), version
          
          
          def segments(data):
              require(data[:6] == b'\x7fELF\x02\x01', 'Native library is not little-endian ELF64')
              require(struct.unpack_from('<H', data, 18)[0] == 183, 'Native library is not AArch64')
              offset = struct.unpack_from('<Q', data, 32)[0]
              width, count = struct.unpack_from('<HH', data, 54)
              require(width >= 56 and offset + width * count <= len(data), 'Invalid ELF program headers')
              return [struct.unpack_from('<IIQQQQQQ', data, offset + width * index)
                      for index in range(count)]
          
          
          def build_id(data):
              for segment in segments(data):
                  if segment[0] != 4:  # PT_NOTE
                      continue
                  position, length = segment[2], segment[5]
                  end = position + length
                  require(end <= len(data), 'ELF note segment extends outside the file')
                  while position + 12 <= end:
                      name_length, description_length, kind = struct.unpack_from('<III', data, position)
                      name_start = position + 12
                      description_start = name_start + ((name_length + 3) & ~3)
                      next_note = description_start + ((description_length + 3) & ~3)
                      require(next_note <= end, 'ELF note extends outside its segment')
                      name = data[name_start:name_start + name_length].rstrip(b'\0')
                      if name == b'GNU' and kind == 3:
                          return data[description_start:description_start + description_length].hex()
                      position = next_note
              raise ValueError('Native engine has no GNU Build ID')
          
          
          def object_bytes(data, symbols, name):
              expression = (r'^\s*\d+:\s*([0-9a-fA-F]+)\s+(\d+)\s+OBJECT\s+'
                            r'\S+\s+\S+\s+\d+\s+' + re.escape(name) + r'\s*$')
              match = re.search(expression, symbols, re.MULTILINE)
              if match is None:
                  return None
              address, size = int(match[1], 16), int(match[2])
              for segment in segments(data):
                  if segment[0] == 1 and segment[3] <= address and address + size <= segment[3] + segment[5]:
                      offset = segment[2] + address - segment[3]
                      return data[offset:offset + size]
              raise ValueError('Native metadata symbol has no file-backed segment: ' + name)
          
          
          def native_source_stamp(data, library, readelf, expected_commit, expected_build):
              symbols = capture([readelf, '--wide', '--symbols', library])
              commit = object_bytes(data, symbols, 'GitSHA1')
              if commit is not None:
                  actual = commit.rstrip(b'\0').decode('ascii')
                  require(actual == expected_commit, library.name + ': native GitSHA1 differs from merged HEAD')
                  commit_method = 'exported GitSHA1'
              else:
                  require(expected_commit.encode('ascii') + b'\0' in data,
                          library.name + ': merged full Git SHA is missing from the native engine')
                  commit_method = 'embedded full Git SHA'
              revision = object_bytes(data, symbols, 'GitRevision')
              if revision is not None:
                  require(len(revision) == 4 and struct.unpack('<i', revision)[0] == expected_build,
                          library.name + ': native GitRevision differs from complete-history Engine Build')
              for marker in NATIVE_MARKERS:
                  require(marker in data, library.name + ': verified GPU/TURN behavior marker is missing')
              return {'source_commit': expected_commit, 'commit_verification': commit_method,
                      'engine_revision_symbol_verified': revision is not None,
                      'verified_gpu_and_network_behavior_markers': True}
          
          
          
          apk_paths=list(Path('input').glob('*.apk'))
          require(len(apk_paths)==1, 'Expected exactly one generated APK')
          apk=apk_paths[0]
          out=Path('export');out.mkdir()
          source=capture(['git','rev-parse','HEAD']).strip()
          require(source=='c3043dcfb89570351ca33adfa786bcede8532843','Unexpected source checkout')
          revision=int(capture(['git','rev-list','--count','HEAD']).strip())
          require(revision==3333,'Incomplete source history')
          tree=capture(['git','rev-parse','HEAD^{tree}']).strip()
          native={}
          with zipfile.ZipFile(apk) as z:
              require(z.testzip() is None,'APK CRC failure')
              manifest_bytes=z.read('assets/engine_provenance.json')
              (out/'engine_provenance.json').write_bytes(manifest_bytes)
              manifest=json.loads(manifest_bytes)
              require(manifest['source_commit']==source and manifest['source_tree']==tree and manifest['engine_build']==revision,'APK provenance mismatch')
              require(z.read('assets/engine_build.txt')==b'3333\n','Stale engine build label')
              require(set(manifest['native_libraries'])==REQUIRED_LIBRARIES,'Native library set changed')
              for name, expected in manifest['native_libraries'].items():
                  data=z.read('lib/arm64-v8a/'+name)
                  require({'size':len(data),'sha256':hashlib.sha256(data).hexdigest()}==expected,'Native manifest mismatch '+name)
                  segments(data)
                  if name in ('libmain.so','libmain60.so'):
                      path=Path('/tmp')/name;path.write_bytes(data)
                      stamp=native_source_stamp(data,path,'readelf',source,revision)
                      require(stamp['engine_revision_symbol_verified'],'Missing native GitRevision symbol')
                      native[name]={'sha256':hashlib.sha256(data).hexdigest(),'size':len(data),'build_id':build_id(data),'source_stamp':stamp}
              require(native['libmain.so']['sha256']!=native['libmain60.so']['sha256'],'Identical rate engines')
              require(native['libmain.so']['build_id']!=native['libmain60.so']['build_id'],'Identical engine Build IDs')
          payload=apk.read_bytes()
          parts=[]
          for index,start in enumerate(range(0,len(payload),24*1024*1024)):
              piece=payload[start:start+24*1024*1024]
              path=out/f'apk.part{index:02d}'
              path.write_bytes(piece)
              parts.append({'filename':path.name,'size':len(piece),'sha256':hashlib.sha256(piece).hexdigest()})
          require(len(parts)<=4,'Unexpected APK size')
          report={'status':'PASS','apk_filename':apk.name,'apk_size':len(payload),'apk_sha256':hashlib.sha256(payload).hexdigest(),'source_commit':source,'engine_build':revision,'source_tree':tree,'native_engines':native,'parts':parts,'device_tests':'NOT TESTED'}
          (out/'native-apk-verification.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PYVERIFY
      - uses: actions/upload-artifact@v7
        with:
          name: merged-apk-native-verification-3333
          path: |
            export/engine_provenance.json
            export/native-apk-verification.json
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: merged-apk-3333-part00
          path: export/apk.part00
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: merged-apk-3333-part01
          path: export/apk.part01
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: merged-apk-3333-part02
          path: export/apk.part02
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: merged-apk-3333-part03
          path: export/apk.part03
          if-no-files-found: ignore
          retention-days: 7
