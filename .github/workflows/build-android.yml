name: Build Android

permissions:
  # GeneralsX @feature Android port 09/07/2026 contents:write is needed for the
  # optional "create a GitHub Release" step below (softprops/action-gh-release
  # needs to create a tag + release + upload an asset). Safe to declare at the
  # workflow level: pull_request (not pull_request_target) from a fork always
  # gets a read-only token from GitHub regardless of this block, and push/
  # workflow_dispatch on this repo both require write access to trigger anyway.
  contents: write
  pull-requests: read
  # GeneralsX @bugfix Android CI 18/07/2026 needed by the "Delete old
  # artifacts" cleanup step below (DELETE .../actions/artifacts/{id}) --
  # without this, that call 403s since an explicit permissions: block (this
  # one) drops every unlisted scope to none rather than defaulting to read.
  actions: write

on:
  # GeneralsX @bugfix Android CI 01/08/2026 dropped the push: trigger that
  # used to fire a full CI build on every push to main/claude/** touching
  # these paths. This session's actual dev loop builds and checksum-verifies
  # locally (scripts/build/android/build-local-sandboxed.sh) before ever
  # pushing, and pushes to BOTH main and the working branch on every commit
  # (main is kept fast-forwarded) -- so every commit was silently kicking off
  # two full ~15min CI builds nobody was looking at, burning real Actions
  # usage for zero benefit. pull_request/workflow_dispatch (manual runs,
  # including the "publish a Release" path) are unaffected and still work
  # exactly as before.
  pull_request:
    branches:
      - main
    paths:
      - 'GeneralsMD/**'
      - 'Core/**'
      - 'Dependencies/**'
      - 'cmake/**'
      - 'android/**'
      - 'scripts/build/android/**'
      - 'Patches/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      engine_report_run:
        description: Read-only diagnostic report artifact run
        required: false
        type: string
      engine_incremental_mode:
        type: choice
        description: "Verified engine state only: inspect, incremental build, or one-time legacy cache export. Never publishes."
        options: [inspect, build, export-legacy, off]
        default: inspect
      engine_backup_run:
        type: string
        description: "Optional run ID holding engine-incremental-state. Empty selects the latest retained backup."
        default: ""
      engine_only_baseline:
        type: boolean
        description: "Limited engine baseline only; no APK, DXVK build, dependency rebuild on cache miss or publication."
        default: false
      recovery_only:
        type: boolean
        description: "Restore Engine 3333 caches and inventory them; never compile or package."
        default: false
      restore_validation_layer:
        type: boolean
        description: "Repackage the existing APK with the baseline validation library; no native build."
        default: false
      verify_apk_run:
        type: string
        description: "Verify an existing run's APK without rebuilding it. Leave blank for a normal build."
        default: ""
      source_ref:
        type: string
        description: "Optional source commit to build using this workflow branch's caches."
        default: ""
      require_existing_caches:
        type: boolean
        description: "Stop on a missing SDK, vcpkg, DXVK or compiler cache instead of starting fresh."
        default: false
      preset:
        type: choice
        description: "CMake preset for Android"
        options:
          - android-vulkan
        default: android-vulkan
      version_name:
        type: string
        description: "Override versionName (e.g. 1.2.0). Leave blank to use the committed default (android/app/build.gradle)."
        default: ""
      version_code:
        type: string
        description: "Override versionCode (must be higher than any build already installed on your device). Leave blank to use the committed default."
        default: ""
      create_release:
        type: boolean
        description: "Also publish a GitHub Release for this build (tag = v<version_name>). Requires version_name above to be set."
        default: false
      release_notes:
        type: string
        description: "Optional custom text for the top of the release description (auto-generated commit/PR notes are still appended below it)."
        default: ""

jobs:
  build-android:
    if: ${{ inputs.engine_incremental_mode == 'off' && !inputs.engine_only_baseline && !inputs.recovery_only && !inputs.verify_apk_run }}
    name: apk@${{ inputs.preset || 'android-vulkan' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PRESET: ${{ inputs.preset || 'android-vulkan' }}
      # Pinned exact NDK release (not "latest") so a cross-compile that works
      # today doesn't silently pick up a different toolchain in six months.
      NDK_VERSION: "27.2.12479018"
      GRADLE_VERSION: "8.9"
      # GeneralsX @build Codex 05/10/2026 Preserve staging and use cached builds without clean tasks.
      GX_INCREMENTAL: "1"
      GX_SECOND_GAME_LIB: "${{ github.workspace }}/build/libmain60.so"
      # cmdline-tools zip (pinned + sha1 from Google's repository2-3.xml manifest);
      # its sdkmanager then installs the NDK/platform/build-tools above.
      CMDLINE_TOOLS_VERSION: "13114758"
      CMDLINE_TOOLS_SHA1: "5fdcc763663eefb86a5b8879697aa6088b041e70"
      # GeneralsX @bugfix Android CI 07/07/2026 vcpkg pinned to a 2026 master
      # commit, NOT the ffc071e0 pin the Linux workflow uses: vcpkg.json
      # overrides ffmpeg to 8.1.1#2 (+ helper port ffmpeg-bin2c 8.1.1), and a
      # checkout's version database must CONTAIN an overridden version to
      # resolve it. ffc071e0's DB tops out at ffmpeg 8.0.1 → run #2 died with
      # "no version database entry for ffmpeg at 8.1.1#2". macOS CI never hit
      # this because ffmpeg comes from Homebrew there; the override is only
      # exercised on ios/android. Non-overridden ports still resolve via the
      # manifest's builtin-baseline, so this bump does not move other deps.
      VCPKG_COMMIT: "42e4e33e1505c9f47b58c21e0f557c1571b751ee"

    steps:
      # GeneralsX @build Android CI 06/07/2026 Node 24 compatible action majors, matching the other platform workflows.
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          # GeneralsX @build Codex 05/10/2026 Fetch the requested source without historical APK blobs.
          fetch-depth: 1
          submodules: false

      # GeneralsX @build Codex 05/10/2026 Record the actual source when borrowing a warm workflow branch.
      - name: Record source revision
        run: |
          echo "Source revision: $(git rev-parse HEAD)"

      - name: Checkout DXVK fork submodule
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 references/fbraz3-dxvk
          # DXVK's OWN submodules (SPIRV-Headers, Vulkan-Headers,
          # libdisplay-info) — meson dies with "Missing SPIRV-Headers" without
          # them; the superproject init above is not recursive.
          git -C references/fbraz3-dxvk submodule update --init --depth 1
          # Pinned commit the superproject's tree points at (reads the gitlink,
          # not the submodule's own shallow history) — used below as a cache key
          # component so a re-pin of the submodule busts the DXVK build cache.
          echo "DXVK_REF=$(git rev-parse HEAD:references/fbraz3-dxvk)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # GeneralsX @bugfix Android CI 06/07/2026 ubuntu-24.04 runner images do NOT
      # ship an Android SDK (run #1 died with "sdkmanager: command not found") —
      # install cmdline-tools from a pinned, checksummed zip and let its own
      # sdkmanager pull the NDK, platform and build-tools. Checksum comes from
      # Google's repository manifest (repository2-3.xml), same discipline as the
      # Vulkan SDK download in build-macos.yml.
      # All caches below use explicit restore/save pairs instead of plain
      # actions/cache: its automatic post-step save only runs when the JOB
      # succeeded, and this workflow is expected to fail repeatedly while the
      # engine cross-compile is being brought up — every failed run would
      # otherwise rebuild ffmpeg/openssl/DXVK from scratch (~45 min). The
      # matching save steps sit at the end of the job with `if: always()`.
      - name: Restore Android SDK cache
        id: cache-android-sdk
        uses: actions/cache/restore@v5
        with:
          path: /opt/android-sdk
          key: android-sdk-${{ env.CMDLINE_TOOLS_VERSION }}-ndk${{ env.NDK_VERSION }}-p35-bt35
      # GeneralsX @build Codex 05/10/2026 Cache-only runs must not reinstall the Android toolchain.
      - name: Require cached Android SDK
        if: inputs.require_existing_caches && steps.cache-android-sdk.outputs.cache-hit != 'true'
        run: |
          echo "::error::Required Android SDK cache was not restored; refusing a fresh toolchain install."
          exit 1

      - name: Install Android SDK (cmdline-tools + NDK + platform + build-tools)
        if: steps.cache-android-sdk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${{ env.CMDLINE_TOOLS_VERSION }}_latest.zip"
          echo "${{ env.CMDLINE_TOOLS_SHA1 }}  /tmp/cmdline-tools.zip" | sha1sum -c -
          sudo mkdir -p /opt/android-sdk/cmdline-tools
          sudo unzip -q /tmp/cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
          # sdkmanager requires the "<sdk>/cmdline-tools/latest" layout to locate its SDK root
          sudo mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          sudo chown -R "$(id -u):$(id -g)" /opt/android-sdk
          rm /tmp/cmdline-tools.zip
          SDKMANAGER=/opt/android-sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "ndk;${{ env.NDK_VERSION }}" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Export Android SDK environment
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/opt/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=/opt/android-sdk/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"
          test -f "/opt/android-sdk/ndk/${{ env.NDK_VERSION }}/build/cmake/android.toolchain.cmake" \
            || { echo "::error::NDK toolchain file missing after install"; exit 1; }

      # Gradle: this project intentionally doesn't commit a wrapper (binary jar),
      # so use Gradle's own official action, which downloads + verifies the
      # requested distribution and puts a `gradle` command on PATH — exactly
      # what scripts/build/android/package-android-zh.sh looks for.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install build tools (meson, ninja, pkg-config, glslang, ccache)
        run: |
          # apt's meson, not pip: ubuntu-latest (24.04) marks the system Python
          # as externally-managed (PEP 668), so a plain `pip install`, even
          # with --user, refuses to run outside a venv.
          # glslang-tools: DXVK compiles its GLSL blit/present shaders to
          # SPIR-V at build time with glslangValidator (host tool).
          # ccache: the z_generals target alone is ~1.6M LOC and was being
          # fully recompiled from scratch on every run (only vcpkg/DXVK/SDK
          # were cached) -- an object-level compiler cache turns a one-file
          # change back into a near-incremental build instead of a 20-40 min
          # full rebuild.
          # Every package below comes from the Ubuntu archive, but the runner
          # image also carries third-party lists (Chrome, Microsoft) whose
          # indexes are periodically served corrupt -- a "Hash Sum mismatch"
          # there makes `apt-get update` exit 100 and, under `bash -e`, kills
          # the whole release build. Drop the lists we do not need, then retry
          # once for a genuinely transient mirror hiccup. A real archive
          # outage still fails loudly on the `install` below.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq || sudo apt-get update -qq || true
          sudo apt-get install -y -qq --no-install-recommends \
            ninja-build meson pkg-config glslang-tools ccache
          meson --version
          ninja --version
          glslangValidator --version | head -1
          ccache --version | head -1

      - name: Restore ccache
        id: cache-ccache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ env.PRESET }}-${{ github.run_id }}
          restore-keys: |
            ccache-android-${{ env.PRESET }}-

      - name: Configure ccache
        run: |
          set -euo pipefail
          ccache --set-config=max_size=3G
          # Cross-compiles (host clang, target arm64-android via NDK sysroot)
          # confuse ccache's default mtime-based direct mode across different
          # checkouts; content hashing keeps hits reliable and is barely
          # slower once warm.
          ccache --set-config=compiler_check=content
          ccache --zero-stats
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"

      - name: Restore vcpkg cache
        id: cache-vcpkg
        uses: actions/cache/restore@v5
        with:
          # /opt/vcpkg = the tool + ports tree; ~/.cache/vcpkg = the BINARY
          # cache of already-built packages (what turns the ~45 min
          # ffmpeg/openssl/curl cross-build into a ~1 min restore).
          path: |
            /opt/vcpkg
            ~/.cache/vcpkg
          key: vcpkg-android-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-lock.json', 'cmake/triplets/arm64-android.cmake') }}
          restore-keys: |
            vcpkg-android-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-

      # Gradle's own dependency/build cache is handled by gradle/actions/setup-gradle above.

      - name: Restore DXVK build cache
        id: cache-dxvk
        uses: actions/cache/restore@v5
        with:
          path: build/${{ env.PRESET }}/_deps/dxvk-build-android
          # github.repository is part of the key (not just DXVK_REF/patch hashes):
          # meson's cached _deps/dxvk-build-android bakes the absolute checkout
          # path (/home/runner/work/<repo>/<repo>/...) into its private build
          # state via --reconfigure. Run #22 restored a cache built under this
          # repo's old name (Generals-Mac-iOS-iPad) and meson died with
          # FileNotFoundError on the now-nonexistent cross-file path -- neither
          # DXVK_REF nor the hashed files changed across the rename, so the
          # stale cache kept being "valid" and kept breaking every run.
          # Tying the key to the repo name means a future rename invalidates
          # this cache instead of silently corrupting it again.
          key: dxvk-android-${{ runner.os }}-${{ github.repository }}-${{ env.DXVK_REF }}-${{ hashFiles('Patches/dxvk-android.patch', 'Patches/dxvk-ios.patch', 'cmake/dx8.cmake', 'cmake/meson-arm64-android-cross.ini.in') }}

      # GeneralsX @build Codex 05/10/2026 Guard native dependency/compiler reuse before configuration.
      - name: Require existing native caches
        if: inputs.require_existing_caches
        env:
          COMPILER_CACHE: ${{ steps.cache-ccache.outputs.cache-matched-key }}
          VCPKG_CACHE: ${{ steps.cache-vcpkg.outputs.cache-matched-key }}
          DXVK_CACHE: ${{ steps.cache-dxvk.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          for cache in "$COMPILER_CACHE" "$VCPKG_CACHE" "$DXVK_CACHE"; do
            if [ -z "$cache" ]; then
              echo "::error::Required native cache was not restored; refusing a fresh dependency build."
              exit 1
            fi
            echo "Restored required cache: $cache"
          done

      - name: Bootstrap vcpkg
        run: |
          set -euo pipefail
          # A cache restored from an older run may hold a checkout at a stale
          # commit — verify and re-pin instead of trusting the cache blindly.
          if [ ! -d /opt/vcpkg/.git ]; then
            git clone https://github.com/microsoft/vcpkg.git /opt/vcpkg
          fi
          CURRENT="$(git -C /opt/vcpkg rev-parse HEAD || echo none)"
          if [ "$CURRENT" != "${{ env.VCPKG_COMMIT }}" ]; then
            git -C /opt/vcpkg fetch origin ${{ env.VCPKG_COMMIT }}
            git -C /opt/vcpkg checkout ${{ env.VCPKG_COMMIT }}
            rm -f /opt/vcpkg/vcpkg  # force tool re-bootstrap matching the tree
          fi
          if [ ! -f /opt/vcpkg/vcpkg ]; then
            /opt/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi
          echo "VCPKG_ROOT=/opt/vcpkg" >> "$GITHUB_ENV"

      # GeneralsX @bugfix Android CI 07/07/2026 set -o pipefail on every
      # `cmd | tee` step: without it the step's exit code is tee's (always 0),
      # and run #2 sailed straight past a fatal configure error into "success"
      # — exactly the pipeline-masking failure the porting playbook warns
      # about. The Verify step caught it; now the failing step reports itself.
      - name: Run save safety and localization host tests
        run: |
          set -euo pipefail
          python3 scripts/qa/test-android-validation-staging.py
          python3 scripts/qa/test-save-map-safety.py
          python3 scripts/qa/test-mod-localization.py

      - name: Configure CMake (Android)
        run: |
          set -o pipefail
          mkdir -p logs
          cmake --preset ${{ env.PRESET }} \
            -DSAGE_HIGH_FPS_SIM=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DANDROID_CI_BUILD_NUMBER=${{ github.run_number }} \
            2>&1 | tee logs/configure_android.log

      - name: Build z_generals (libmain.so) + DXVK d3d8/d3d9
        run: |
          set -o pipefail
          mkdir -p logs
          # ninja -k 0: keep going past failures so ONE run surfaces every
          # cross-compile error in the 1.6M-LOC engine instead of one per
          # round-trip; the exit code still fails the step when anything broke.
          # main_hook/file_redirect_hook/gsl_alloc_hook/hook_impl
          # (cmake/adrenotools.cmake): dlopen()'d by path at runtime, not a
          # link-time dependency of z_generals, so a targeted build skips them
          # unless named explicitly -- package-android-zh.sh's jniLibs staging
          # requires all four to already exist.
          cmake --build build/${{ env.PRESET }} --target z_generals dxvk_d3d8_install \
            main_hook file_redirect_hook gsl_alloc_hook hook_impl -- -k 0 2>&1 | tee logs/build_android.log
          ccache --show-stats

      # GeneralsX @build Codex 05/10/2026 Ship both simulation-rate engines from the same source revision.
      - name: Preserve 60 Hz engine and build default 30 Hz engine
        run: |
          set -euo pipefail
          cp "build/${PRESET}/GeneralsMD/Code/Main/libmain.so" "$GX_SECOND_GAME_LIB"
          cmake --preset "$PRESET" \
            -DSAGE_HIGH_FPS_SIM=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DANDROID_CI_BUILD_NUMBER=${{ github.run_number }} \
            2>&1 | tee logs/configure_android_30.log
          cmake --build "build/${PRESET}" --target z_generals -- -k 0 \
            2>&1 | tee logs/build_android_30.log
          ccache --show-stats

      - name: Verify artifacts
        run: |
          set -euo pipefail
          READELF="$(ls "${ANDROID_NDK_HOME}"/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -1)"
          # GeneralsX @bugfix Android port 13/07/2026 - this step has
          # intermittently failed "libmain.so is not AArch64" (builds #118,
          # #127, #129) within milliseconds of ninja's own "Linking ...
          # libmain.so" line, always on an otherwise-clean build (re-running
          # the identical commit always passes). The broad `find ... -name
          # libmain.so | head -1` this used to run has no ordering guarantee
          # when the build dir accumulates more than one match across cached/
          # incremental runs (ccache + vcpkg + DXVK build caches are all
          # restored between runs) -- `head -1` can silently grab a stale or
          # wrong-arch copy instead of the one ninja just linked. The target's
          # own OUTPUT_NAME (GeneralsMD/Code/Main/CMakeLists.txt) makes the
          # real path deterministic, so use it directly instead of searching.
          GAME_LIB="build/${{ env.PRESET }}/GeneralsMD/Code/Main/libmain.so"
          if [ ! -f "$GAME_LIB" ]; then echo "::error::libmain.so not found at $GAME_LIB"; exit 1; fi
          # GeneralsX @bugfix Android port 31/07/2026 - the deterministic
          # OUTPUT_NAME path above (13/07/2026 fix) stopped `head -1` from
          # grabbing the wrong file, but the readelf check itself still
          # failed twice in a row on two otherwise-clean reruns of the exact
          # same commit (both with warm ccache/vcpkg/DXVK caches, both
          # failing within ~25ms of this step starting) -- pointing at an
          # I/O visibility race on the runner rather than a real wrong-arch
          # binary: the prior step already exited 0, so the linker's writes
          # should be complete, but the file's content isn't always visible
          # to a process started microseconds later. Retry a few times with
          # a short sleep before failing for real; a genuinely wrong-arch
          # binary will still fail every attempt and correctly error out.
          READELF_OK=0
          for attempt in 1 2 3 4 5; do
            if "$READELF" -h "$GAME_LIB" 2>/dev/null | grep -q AArch64; then
              READELF_OK=1
              break
            fi
            sleep 1
          done
          [ "$READELF_OK" = "1" ] || { echo "::error::libmain.so is not AArch64"; exit 1; }
          for lib in libdxvk_d3d8.so libdxvk_d3d9.so; do
            [ -f "build/${{ env.PRESET }}/$lib" ] || { echo "::error::$lib missing"; exit 1; }
          done
          strings "build/${{ env.PRESET }}/libdxvk_d3d9.so" | grep -q Sdl3WsiDriver || {
            echo "::error::libdxvk_d3d9.so built without the SDL3 WSI (silent fallback)"; exit 1; }
          echo "Artifacts verified: AArch64 libmain.so + DXVK with SDL3 WSI"

      # GeneralsX @feature Android CI 06/09/2026 The strip step below is what
      # keeps the APK at ~42MB instead of ~118MB, but it also destroys the one
      # thing that made real device tombstones readable: several fixes in this
      # port were found by resolving crash addresses against that exact build's
      # unstripped libmain.so, and nothing in the pipeline kept a copy, so a
      # released build's crash log can no longer be symbolized at all.
      # Uploading the unstripped library is not an option -- it is ~282MB on
      # its own and this repo's entire Actions storage quota is 0.5GB (see the
      # retention comment on the APK upload below). A text symbol table costs a
      # few MB instead, and address -> function+offset is what those
      # investigations actually used. The program headers travel with it so the
      # vaddr-vs-file-offset bias (the +0x1000 one, rediscovered by hand more
      # than once) is written down next to the symbols it applies to.
      - name: Collect symbol table (before stripping)
        run: |
          set -e
          TOOLS="$(dirname "$(ls "${ANDROID_NDK_HOME}"/toolchains/llvm/prebuilt/*/bin/llvm-nm | head -1)")"
          LIB="build/${{ env.PRESET }}/GeneralsMD/Code/Main/libmain.so"
          mkdir -p symbols
          OUT="symbols/libmain-run${{ github.run_number }}.symbols.txt"
          BUILD_ID="$(readelf -n "$LIB" 2>/dev/null | sed -n 's/.*Build ID: \([0-9a-f]*\).*/\1/p' | head -1)"
          {
            echo "# libmain.so symbols -- run ${{ github.run_number }}, commit $(git rev-parse HEAD)"
            echo "# Match this BuildID against the tombstone's before trusting any address."
            # llvm-readelf --notes prints the note's header but not the build-id
            # value itself, so pull it out with GNU readelf, which does.
            echo "# BuildID: ${BUILD_ID:-UNKNOWN}"
            "$TOOLS/llvm-readelf" --notes --program-headers "$LIB"
            echo "# --- defined symbols: address size type name ---"
            "$TOOLS/llvm-nm" --defined-only --numeric-sort --print-size --demangle "$LIB"
          } > "$OUT"
          # A table that came out empty (wrong path, or a library that was
          # already stripped upstream of here) is worse than no table: it
          # would ship attached to a Release looking authoritative. Say so.
          SYMS=$("$TOOLS/llvm-nm" --defined-only "$LIB" 2>/dev/null | wc -l)
          echo "Symbols captured: ${SYMS}"
          if [ "${SYMS}" -lt 1000 ]; then
            echo "::warning::libmain.so yielded only ${SYMS} symbols -- crash logs from this build will not symbolize."
          fi
          gzip -9 "$OUT"
          ls -la symbols/

      # GeneralsX @bugfix Android CI 06/08/2026 CI never stripped debug
      # symbols, so every uploaded artifact/Release asset shipped a fully
      # unstripped libmain.so (282MB on its own) straight into the APK --
      # AGP's own stripReleaseDebugSymbols task fails silently on all of our
      # custom-built libraries for an unrelated reason (see build.gradle),
      # so nothing else in the pipeline ever did this either. The local dev
      # loop (scripts/build/android/build-local-sandboxed.sh) already runs
      # this exact llvm-strip pass and ships a ~48MB APK instead of the
      # ~118MB one CI had been producing (confirmed against the v1.1.5
      # release asset) -- port it here so public builds get the same win.
      # libdxvk_d3d8.so/libdxvk_d3d9.so are deliberately excluded: stripping
      # them crashes DXVK's draw path on real hardware (keepDebugSymbols in
      # android/app/build.gradle has the full story).
      - name: Collect 60 Hz symbol table (before stripping)
        run: |
          set -euo pipefail
          TOOLS="$(dirname "$(ls "${ANDROID_NDK_HOME}"/toolchains/llvm/prebuilt/*/bin/llvm-nm | head -1)")"
          OUT="symbols/libmain60-run${{ github.run_number }}.symbols.txt"
          {
            echo "# libmain60.so symbols -- commit $(git rev-parse HEAD)"
            readelf -n "$GX_SECOND_GAME_LIB"
            "$TOOLS/llvm-readelf" --program-headers "$GX_SECOND_GAME_LIB"
            "$TOOLS/llvm-nm" --defined-only --numeric-sort --print-size --demangle "$GX_SECOND_GAME_LIB"
          } > "$OUT"
          gzip -9 "$OUT"

      - name: Strip debug symbols
        run: |
          STRIP="$(ls "${ANDROID_NDK_HOME}"/toolchains/llvm/prebuilt/*/bin/llvm-strip | head -1)"
          for lib in "build/${{ env.PRESET }}/GeneralsMD/Code/Main/libmain.so" \
                     "$GX_SECOND_GAME_LIB" \
                     "build/${{ env.PRESET }}/_deps/sdl3-build/libSDL3.so" \
                     "build/${{ env.PRESET }}/_deps/sdl3_image-build/libSDL3_image.so" \
                     "build/${{ env.PRESET }}/_deps/openal_soft-build/libopenal.so" \
                     "build/${{ env.PRESET }}/libgamespy.so" \
                     "build/${{ env.PRESET }}/_deps/adrenotools-build/libadrenotools.so" \
                     "build/${{ env.PRESET }}/_deps/adrenotools-build/src/hook/libgsl_alloc_hook.so" \
                     "build/${{ env.PRESET }}/_deps/adrenotools-build/src/hook/libhook_impl.so" \
                     "build/${{ env.PRESET }}/_deps/adrenotools-build/src/hook/libmain_hook.so" \
                     "build/${{ env.PRESET }}/_deps/adrenotools-build/src/hook/libfile_redirect_hook.so"; do
            [ -f "$lib" ] && "$STRIP" --strip-unneeded "$lib"
          done

      - name: Set artifact version
        id: artifact
        run: |
          # GeneralsX @feature Android port 08/07/2026 Version numbers are
          # manually managed (android/app/build.gradle), not auto-bumped from
          # the workflow run number anymore. A manual "Run workflow" dispatch
          # can still override them for a one-off build via the version_name /
          # version_code inputs above; a normal push build passes neither, so
          # Gradle falls back to whatever is committed in build.gradle.
          echo "version_code=${{ inputs.version_code || '' }}" >> "$GITHUB_OUTPUT"
          echo "version_name=${{ inputs.version_name || '' }}" >> "$GITHUB_OUTPUT"
          echo "apk_name=GeneralsXZH-android-run${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"

      - name: Package APK
        env:
          # scripts/build/android/package-android-zh.sh uses these to stage
          # jniLibs/, the SDL3 Java glue, and fonts, then invokes Gradle. Same
          # fixed debug.keystore every run (committed in android/app/) is what
          # makes consecutive CI builds installable as updates over each other
          # rather than requiring an uninstall, PROVIDED versionCode was bumped
          # by hand (in build.gradle or via a manual-dispatch override) since
          # the last build the user actually installed.
          GX_ANDROID_STAGING: ${{ github.workspace }}/android-staging
          GX_ANDROID_VERSION_CODE: ${{ steps.artifact.outputs.version_code }}
          GX_ANDROID_VERSION_NAME: ${{ steps.artifact.outputs.version_name }}
        run: |
          ./scripts/build/android/package-android-zh.sh

      - name: Locate APK
        id: locate
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then echo "::error::APK not found at $APK"; exit 1; fi
          cp "$APK" "${{ steps.artifact.outputs.apk_name }}"
          echo "path=${{ steps.artifact.outputs.apk_name }}" >> "$GITHUB_OUTPUT"

      # GeneralsX @bugfix Android CI 07/07/2026 A real device caught what CI
      # missed: run #10's APK was missing libgamespy.so (a genuine DT_NEEDED
      # of libmain.so, not an optional lib) and crashed at dlopen on launch —
      # package-android-zh.sh only warned, and nothing checked the actual APK
      # contents against what libmain.so declares it needs. Do that here:
      # every non-system DT_NEEDED of libmain.so must be a real file inside
      # the APK's lib/arm64-v8a/, or the build is not actually shippable.
      - name: Verify APK contains every library libmain.so needs
        run: |
          set -euo pipefail
          READELF="$(ls "${ANDROID_NDK_HOME}"/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -1)"
          APK="${{ steps.locate.outputs.path }}"
          WORKDIR="$(mktemp -d)"
          unzip -q "${APK}" 'lib/arm64-v8a/*' -d "${WORKDIR}"
          # GeneralsX @build Codex 05/10/2026 Both launcher simulation choices must be packaged.
          test -s "${WORKDIR}/lib/arm64-v8a/libmain.so"
          test -s "${WORKDIR}/lib/arm64-v8a/libmain60.so"
          echo "Packaged libraries:"
          ls "${WORKDIR}/lib/arm64-v8a/"
          NEEDED="$("${READELF}" -d "${WORKDIR}/lib/arm64-v8a/libmain.so" | grep NEEDED | sed -E 's/.*\[(.*)\]/\1/')"
          missing=0
          for lib in ${NEEDED}; do
            case "${lib}" in
              libc.so|libm.so|libdl.so|liblog.so|libandroid.so|libGLESv*|libEGL.so|libvulkan.so|libOpenSLES.so|libaaudio.so|libmediandk.so|libcamera2ndk.so|libjnigraphics.so|libnativewindow.so|libsync.so|libz.so)
                continue ;;  # system libs every device provides via the NDK stable ABI (run
                             # #11 caught libmediandk.so, pulled in by FFmpeg's MediaCodec
                             # backend, missing from this allowlist — see docs/port/ANDROID_PORT.md)
            esac
            if [ ! -f "${WORKDIR}/lib/arm64-v8a/${lib}" ]; then
              echo "::error::libmain.so needs '${lib}' at runtime but it is not packaged in the APK"
              missing=1
            fi
          done
          rm -rf "${WORKDIR}"
          if [ "${missing}" -ne 0 ]; then
            echo "::error::APK is missing required native libraries — it would crash with dlopen failed on any real device."
            exit 1
          fi
          echo "OK: every DT_NEEDED of libmain.so is present in the APK."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.apk_name }}
          path: ${{ steps.locate.outputs.path }}
          # GeneralsX @bugfix Android CI 18/07/2026 was 30: the free plan's
          # Actions storage quota is 0.5 GB total and each APK is ~110 MB, so
          # a single busy day of testing (this project pushes several builds
          # an hour while chasing device-specific bugs) filled it to 90% on
          # its own even with the "Delete old artifacts" cleanup step below.
          # 7 days is still ample time for a tester to grab a build.
          retention-days: 7

      # Same 7 days as the APK above on purpose: the table is only useful while
      # someone can still be running the build it came from, and the cleanup
      # step below keeps just the newest run per branch anyway. Released builds
      # do not rely on this copy -- their table is attached to the Release.
      - name: Upload symbol table artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-symbols-run${{ github.run_number }}
          path: symbols/
          # GeneralsX @bugfix Android CI 19/09/2026 was 7, copied from the APK
          # above -- but the quota argument there does not apply here: an APK is
          # ~110 MB, this is a gzipped text symbol table of a few MB. Seven days
          # is shorter than the round trip on a tester report, and that is not
          # hypothetical: a crash reported on 19/09/2026 came from a build whose
          # symbol bundle had already expired, so symbolizing it meant searching
          # every historical APK committed under apk/ for one whose symbol table
          # agreed with the log. Keep these for the full 90 days.
          retention-days: 90

      # GeneralsX @feature Android port 09/07/2026 Actions artifacts expire
      # (30 days) and require a GitHub login to download -- not a real "here,
      # everyone download this" link. Manual dispatch with create_release=true
      # publishes an actual GitHub Release with the APK attached instead,
      # tagged from version_name (set alongside it above) so the release name
      # always matches what's baked into the APK's own versionName.
      - name: Create GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release }}
        run: |
          set -euo pipefail
          if [ -z "${{ inputs.version_name }}" ]; then
            echo "::error::create_release requires version_name to be set (used as the release tag)."
            exit 1
          fi

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          name: v${{ inputs.version_name }}
          body: ${{ inputs.release_notes }}
          files: |
            ${{ steps.locate.outputs.path }}
            symbols/libmain-run${{ github.run_number }}.symbols.txt.gz
          generate_release_notes: true
          make_latest: true

      - name: Collect dependency build logs for diagnosis
        if: always()
        run: |
          mkdir -p logs
          # vcpkg writes the real failure details one level below the summary
          # that lands in configure_android.log — pull them into the artifact.
          cp build/${{ env.PRESET }}/vcpkg-manifest-install.log logs/ 2>/dev/null || true
          if [ -d /opt/vcpkg/buildtrees ]; then
            find /opt/vcpkg/buildtrees -maxdepth 2 -name "*.log" -newer .git -exec cp {} logs/ \; 2>/dev/null || true
          fi
          # DXVK meson configure log, when that stage was reached
          cp build/${{ env.PRESET }}/_deps/dxvk-build-android/meson-logs/meson-log.txt logs/dxvk-meson-log.txt 2>/dev/null || true
          ls -la logs/ || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-build-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

      # GeneralsX @feature Android CI 18/07/2026 Actions storage is a shared
      # 0.5 GB account-wide quota (free plan), not per-repo or per-branch --
      # a day of iterating on device-specific bugs (several APK builds/hour,
      # ~110 MB each) fills it well before the retention-days above ever
      # kick in on their own. First pass scoped cleanup only to same-branch
      # artifacts and left main/other branches' old builds untouched, which
      # turned out to be most of the remaining quota (main alone had ~30
      # same-day runs with live artifacts). Sweep the WHOLE repository now:
      # for every branch this workflow has ever run on, keep only its most
      # recent run's artifacts and delete every other run's, regardless of
      # which branch triggered the current run. gh/GITHUB_TOKEN are
      # preinstalled/preauthenticated on every GitHub-hosted runner;
      # `actions: write` above is what authorizes the delete call itself.
      # Best-effort throughout: a delete failing (already expired, already
      # deleted by a concurrent run) must not fail the build.
      # GeneralsX @build Codex 05/10/2026 Preserve existing APK artifacts during baseline validation.
      - name: Delete superseded artifacts across all branches
        if: ${{ false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          declare -A latest_run

          while IFS=$'\t' read -r branch run_id; do
            [ -z "${branch}" ] && continue
            if [ -z "${latest_run[$branch]:-}" ] || [ "${run_id}" -gt "${latest_run[$branch]}" ]; then
              latest_run[$branch]="${run_id}"
            fi
          done < <(gh api "repos/${{ github.repository }}/actions/artifacts" --paginate \
            --jq '.artifacts[] | [(.workflow_run.head_branch // ""), .workflow_run.id] | @tsv')

          gh api "repos/${{ github.repository }}/actions/artifacts" --paginate \
            --jq '.artifacts[] | [(.workflow_run.head_branch // ""), .workflow_run.id, .id] | @tsv' \
          | while IFS=$'\t' read -r branch run_id artifact_id; do
              [ -z "${branch}" ] && continue
              if [ "${run_id}" != "${latest_run[$branch]:-}" ]; then
                echo "Deleting old artifact ${artifact_id} (branch ${branch}, run ${run_id}, latest for that branch is ${latest_run[$branch]})"
                gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${artifact_id}" || true
              fi
            done

      # Save caches even when the job failed (see the restore steps above for
      # why plain actions/cache can't do this). Guard each save so a run that
      # restored an exact-key hit doesn't fail trying to re-save it.
      - name: Save Android SDK cache
        if: always() && steps.cache-android-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /opt/android-sdk
          key: android-sdk-${{ env.CMDLINE_TOOLS_VERSION }}-ndk${{ env.NDK_VERSION }}-p35-bt35

      - name: Save vcpkg cache
        if: always() && steps.cache-vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            /opt/vcpkg
            ~/.cache/vcpkg
          key: vcpkg-android-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-lock.json', 'cmake/triplets/arm64-android.cmake') }}

      - name: Save DXVK build cache
        if: always() && steps.cache-dxvk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: build/${{ env.PRESET }}/_deps/dxvk-build-android
          # github.repository is part of the key (not just DXVK_REF/patch hashes):
          # meson's cached _deps/dxvk-build-android bakes the absolute checkout
          # path (/home/runner/work/<repo>/<repo>/...) into its private build
          # state via --reconfigure. Run #22 restored a cache built under this
          # repo's old name (Generals-Mac-iOS-iPad) and meson died with
          # FileNotFoundError on the now-nonexistent cross-file path -- neither
          # DXVK_REF nor the hashed files changed across the rename, so the
          # stale cache kept being "valid" and kept breaking every run.
          # Tying the key to the repo name means a future rename invalidates
          # this cache instead of silently corrupting it again.
          key: dxvk-android-${{ runner.os }}-${{ github.repository }}-${{ env.DXVK_REF }}-${{ hashFiles('Patches/dxvk-android.patch', 'Patches/dxvk-ios.patch', 'cmake/dx8.cmake', 'cmake/meson-arm64-android-cross.ini.in') }}

      # Always re-save under this run's unique key (the restore-keys prefix
      # match above means later runs pick up the freshest available cache);
      # actions/cache never overwrites an existing exact key, and github.run_id
      # is unique per run, so this never no-ops into a skipped save.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ env.PRESET }}-${{ github.run_id }}

  # GeneralsX @build Codex 05/10/2026 Verify the existing artifact on a warm runner without recompiling.
  verify-existing-apk:
    if: ${{ !inputs.engine_only_baseline && (!inputs.recovery_only && (inputs.verify_apk_run != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache/restore@v5
        id: verify-sdk
        with:
          path: /opt/android-sdk
          key: android-sdk-13114758-ndk27.2.12479018-p35-bt35
      - name: Require existing SDK tools
        run: |
          test '${{ steps.verify-sdk.outputs.cache-hit }}' = true
      - uses: actions/download-artifact@v5
        with:
          pattern: GeneralsXZH-android-run*.apk
          run-id: ${{ inputs.verify_apk_run }}
          github-token: ${{ github.token }}
          path: verification-input
          merge-multiple: true
      # GeneralsX @bugfix Codex 05/10/2026 Carry the omitted baseline diagnostic library into the existing artifact.
      - name: Restore baseline validation layer without recompiling
        if: inputs.restore_validation_layer
        env:
          GX_VULKAN_VALIDATION: ${{ github.workspace }}/verification-layer
        run: |
          set -euo pipefail
          python3 scripts/qa/test-android-validation-staging.py
          ./scripts/build/android/fetch-vulkan-validation-layer.sh
          python3 - <<'PYREPACK'
          from pathlib import Path
          import hashlib,re,subprocess,zipfile
          original=list(Path('verification-input').glob('*.apk'))
          assert len(original)==1
          lib=Path('verification-layer/libVkLayer_khronos_validation.so')
          assert hashlib.sha256(lib.read_bytes()).hexdigest()=='1b8e4bc4701c6f7448bf6028aed4a787fb04e2e2aa8c2ad47265101ccffacc68'
          out=Path('verification-output');out.mkdir()
          unsigned=out/'unsigned.zip'
          def signature(name):
              return bool(re.match(r'^META-INF/[^/]+\.(SF|RSA|DSA|EC|MF)$',name,re.I))
          layer='lib/arm64-v8a/libVkLayer_khronos_validation.so'
          with zipfile.ZipFile(original[0]) as src,zipfile.ZipFile(unsigned,'w') as dst:
              for entry in src.infolist():
                  if not signature(entry.filename) and entry.filename!=layer:
                      dst.writestr(entry,src.read(entry.filename))
              dst.write(lib,layer,compress_type=zipfile.ZIP_DEFLATED)
          apk=out/'GeneralsZH-SaveOnline-debug.apk'
          tools=Path('/opt/android-sdk/build-tools/35.0.0')
          subprocess.run([str(tools/'zipalign'),'-P','16','4',str(unsigned),str(apk)],check=True)
          subprocess.run([str(tools/'apksigner'),'sign','--ks','android/app/debug.keystore','--ks-pass','pass:android','--key-pass','pass:android',str(apk)],check=True)
          with zipfile.ZipFile(original[0]) as src,zipfile.ZipFile(apk) as dst:
              for entry in src.infolist():
                  if not signature(entry.filename) and entry.filename!=layer:
                      assert src.read(entry.filename)==dst.read(entry.filename),entry.filename
          print('PASS: every original non-signature payload, including both engines, is byte-identical')
          PYREPACK

      - name: Verify signature, identity, alignment and native payload
        env:
          EXPECTED_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import hashlib,json,os,re,struct,subprocess,zipfile
          apks=list(Path('verification-output').glob('*.apk')) or list(Path('verification-input').glob('*.apk'))
          assert len(apks)==1,apks
          apk=apks[0];tools=Path('/opt/android-sdk/build-tools/35.0.0')
          signature=subprocess.check_output([str(tools/'apksigner'),'verify','--print-certs',str(apk)],text=True)
          signer=re.search(r'Signer #1 certificate SHA-256 digest: (\w+)',signature).group(1)
          key=subprocess.check_output(['keytool','-list','-v','-keystore','android/app/debug.keystore','-storepass','android','-alias','androiddebugkey'],text=True)
          expected=re.search(r'SHA256: ([0-9A-F:]+)',key).group(1).replace(':','').lower()
          assert signer==expected and signer=='644a3b0f8234c6ea8960ece9b55a161c00966b8dd522d2558d84883f4f77c48e'
          badging=subprocess.check_output([str(tools/'aapt2'),'dump','badging',str(apk)],text=True)
          package,code,version=re.search(r"package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'",badging).groups()
          assert package=='com.generalsx.zerohour' and code==os.environ['EXPECTED_VERSION_CODE']
          subprocess.run([str(tools/'zipalign'),'-c','-P','16','4',str(apk)],check=True)
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              assert len(z.namelist())==len(set(z.namelist()))
              libs=[n for n in z.namelist() if n.startswith('lib/arm64-v8a/') and n.endswith('.so')]
              for name in libs:
                  data=z.read(name)
                  assert data[:4]==b'\x7fELF' and struct.unpack_from('<H',data,18)[0]==183,name
              if Path('verification-output').exists():
                  assert len(libs)==17
                  assert hashlib.sha256(z.read('lib/arm64-v8a/libVkLayer_khronos_validation.so')).hexdigest()=='1b8e4bc4701c6f7448bf6028aed4a787fb04e2e2aa8c2ad47265101ccffacc68'
              for engine in ['libmain.so','libmain60.so']:
                  assert 'lib/arm64-v8a/'+engine in libs
              assert z.read('lib/arm64-v8a/libmain.so')!=z.read('lib/arm64-v8a/libmain60.so')
          report={'apk':apk.name,'bytes':apk.stat().st_size,'sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'package':package,'version_code':int(code),'version_name':version,'signer_sha256':signer,'native_libraries':len(libs),'signature_identity_zip_alignment_crc_and_AArch64':'PASS','device_tests':'NOT TESTED'}
          Path('apk-verification.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PYVERIFY
      - uses: actions/upload-artifact@v7
        with:
          name: apk-verification-${{ inputs.verify_apk_run }}
          path: apk-verification.json
          retention-days: 7
      - name: Upload corrected APK
        if: inputs.restore_validation_layer
        uses: actions/upload-artifact@v7
        with:
          name: GeneralsZH-SaveOnline-debug.apk
          path: verification-output/GeneralsZH-SaveOnline-debug.apk
          retention-days: 7

  recover-engine-3333:
    if: ${{ !inputs.engine_only_baseline && (inputs.recovery_only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
