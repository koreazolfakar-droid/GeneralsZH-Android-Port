name: Export unchanged recovered Engine 3333 caches
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  export-recovered-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the already-restored cache artifact without a build
        uses: actions/download-artifact@v5
        with:
          name: engine-3333-recovery-core
          run-id: 37452751872
          github-token: ${{ github.token }}
          path: recovered
      - uses: actions/upload-artifact@v7
        with:
          name: recovery-3333-compiler-cache
          path: recovered/ccache-3333.tar.gz
          compression-level: 9
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: recovery-3333-dxvk-state
          path: recovered/dxvk-used-by-3333.tar.gz
          compression-level: 9
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: recovery-3333-inventory
          path: recovered/recovery-inventory.json
          compression-level: 9
          retention-days: 30
