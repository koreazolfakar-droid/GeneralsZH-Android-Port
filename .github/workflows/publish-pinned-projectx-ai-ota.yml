# One-time recovery: publish the ALREADY successful native 30/60Hz engine build.
# GeneralsX @build Codex 14/10/2026 Reuse the registered publisher for the verified
# terrain reuse pair; sign-update.yml on the development branch is not registered.
# No engine recompilation, no APK, pinned and already merged source.
name: Sign and publish terrain reuse engine (one time)
on:
  push:
    branches: [dev/mobile-v4]
    paths: [.github/workflows/publish-pinned-projectx-ai-ota.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: own-engine-update-publish
  cancel-in-progress: false
jobs:
  signed-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMIT: c40a361857edfe70842f26ddb2a76d47ebda4ba4
      NATIVE_RUN: '38535040332'
      PREVIOUS_HEAD: 71c0bc47d57f5a1bed58841fc2fddceffcd60cb5
      PREVIOUS_ENGINE: '3477'
      PREVIOUS_SERIAL: '14'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c40a361857edfe70842f26ddb2a76d47ebda4ba4
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Verify exact trigger and previous OTA version
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/dev/mobile-v4
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse --is-shallow-repository)" = false
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev/mobile-v4" --jq .object.sha)" = "$GITHUB_SHA"
          git fetch origin "$GITHUB_SHA" --filter=blob:none
          test "$(git rev-parse "$GITHUB_SHA^")" = "$PREVIOUS_HEAD"
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$PREVIOUS_HEAD"
          test "$(git rev-parse "$SOURCE_COMMIT^{tree}")" = "$(git rev-parse "$PREVIOUS_HEAD^{tree}")"
          test "$(git show -s --format=%s "$GITHUB_SHA")" = 'ci(update): publish verified terrain reuse engine'
          changed="$(git diff --name-only "$PREVIOUS_HEAD" "$GITHUB_SHA")"
          test "$changed" = .github/workflows/publish-pinned-projectx-ai-ota.yml
          gh api "repos/$GITHUB_REPOSITORY/contents/manifest.json?ref=updates" --jq .content | base64 --decode > "$RUNNER_TEMP/old-manifest.json"
          python3 - <<'PY'
          import json,os,pathlib
          m=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'old-manifest.json').read_text())
          assert m['serial']==int(os.environ['PREVIOUS_SERIAL'])
          assert m['engine']['seq']==int(os.environ['PREVIOUS_ENGINE'])
          assert m['engine']['source_commit']=='0c2abdb81c76261f2ced12d5f5b1094a8cef625b'
          assert set(m['engine']['files'])=={'libmain.so','libmain60.so'}
          print('PASS: existing signed channel unchanged and previous engine available')
          PY
      - name: Authenticate successful, immutable dual-native build provenance
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NATIVE_RUN" | python3 -c '
          import json,os,sys
          r=json.load(sys.stdin)
          assert r["status"]=="completed" and r["conclusion"]=="success"
          assert r["head_sha"]==os.environ["SOURCE_COMMIT"]
          assert r["event"]=="workflow_dispatch"
          assert r["path"]==".github/workflows/build-android.yml"
          assert r["head_repository"]["full_name"]==os.environ["GITHUB_REPOSITORY"]
          print("PASS: exact source dual-engine build",r["id"])
          '
          test "$(bash scripts/build/android/engine-build-number.sh "$PWD")" -gt "$PREVIOUS_ENGINE"
      - uses: actions/download-artifact@v5
        with:
          name: engine-incremental-report
          run-id: 38535040332
          github-token: ${{ github.token }}
          path: engine-build
      - uses: actions/download-artifact@v5
        with:
          name: Bootstrap-1.4.3-Engine3333-debug.apk
          run-id: 37422581004
          github-token: ${{ github.token }}
          path: bootstrap-baseline
      - name: Prepare version-pinned native update (strict runtime compatibility)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update/prepare-engine-run.py \
            --report-dir engine-build \
            --baseline-apk bootstrap-baseline/GeneralsZH-Bootstrap-1.4.3-Engine3333-debug.apk \
            --expected-source "$SOURCE_COMMIT" \
            --out prepared-update \
            --note 'Engine 3481 candidate: reuse identical static terrain bytes, narrow changed transfers with synchronized D3D lock semantics, and add complete CPU/pacer percentiles, load/terrain/BIG timing and AI NaN/Inf probes. ARM64 30Hz/60Hz engines pass CI and preserve APK runtime dependencies. User-authorized publication for device validation; phone FPS, mod visual correctness and installation remain unmeasured.'
          python3 - <<'PY'
          import json,os
          r=json.load(open("engine-build/result.json"))
          m=json.load(open("prepared-update/manifest.json"))
          assert r["build"]=="PASS" and r["new_apk_required"] is False
          assert r["source_head"]==os.environ["SOURCE_COMMIT"]
          assert m["engine"]["source_commit"]==os.environ["SOURCE_COMMIT"]
          assert m["engine"]["seq"]==3481 and m["serial"]==int(os.environ["PREVIOUS_SERIAL"])+1
          assert set(m["engine"]["files"])=={"libmain.so","libmain60.so"}
          print("PASS: prepared safe native engine",m["engine"]["seq"])
          PY
      - name: ECDSA sign and cryptographically verify native pair
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/update/sign-manifest.sh prepared-update
      - name: Publish on the existing signed OTA updates branch
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git --hostname github.com
          bash scripts/update/push-updates-branch.sh prepared-update
      - name: Verify live signature, source, and immutable 30/60Hz URLs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published-check
          for file in manifest.json manifest.json.sig; do
            gh api "repos/$GITHUB_REPOSITORY/contents/$file?ref=updates" --jq .content | base64 --decode > "published-check/$file"
          done
          python3 - <<'PY'
          import hashlib,importlib.util,json,os,pathlib,urllib.request,gzip,time
          spec=importlib.util.spec_from_file_location("artifacts","scripts/update/update-artifacts.py")
          a=importlib.util.module_from_spec(spec);spec.loader.exec_module(a)
          m=a.verify_manifest("published-check","android/app/src/main/assets/update-public.pem")
          assert m["engine"]["source_commit"]==os.environ["SOURCE_COMMIT"]
          assert m["engine"]["seq"]==3481 and m["serial"]==int(os.environ["PREVIOUS_SERIAL"])+1
          for name,row in m["engine"]["files"].items():
            url=row["url"]
            assert url==a.BASE_URL+f"engine/{m['engine']['seq']}/{name}.gz"
            data=None
            for attempt in range(5):
              try:
                with urllib.request.urlopen(url,timeout=90) as response:
                  data=gzip.decompress(response.read())
                break
              except Exception:
                if attempt==4: raise
                time.sleep(6)
            assert len(data)==row["size"]
            assert hashlib.sha256(data).hexdigest()==row["sha256"]
            a.native_stamp(data,os.environ["SOURCE_COMMIT"],m["engine"]["seq"])
          print("PASS: SIGNED OTA PUBLISHED engine",m["engine"]["seq"],"serial",m["serial"])
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
            f.write(f"### Verified native engine OTA published (no APK)\nEngine {m['engine']['seq']}; serial {m['serial']}; source {os.environ['SOURCE_COMMIT']}\n")
          PY
