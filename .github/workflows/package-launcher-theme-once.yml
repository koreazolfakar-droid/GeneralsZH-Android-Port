name: Package launcher Day Night APK without native rebuild
on:
  push:
    branches: [main]
    paths: ['.github/workflows/package-launcher-theme-once.yml']
permissions:
  contents: write
  actions: read
jobs:
  launcher-apk:
    if: github.repository == 'koreazolfakar-droid/GeneralsZH-Android-Port'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      REPO: koreazolfakar-droid/GeneralsZH-Android-Port
      BRANCH: feature/launcher-day-night-20261010
      SOURCE_SHA: 20a0b37d7342e8831e03479d8f274aec7c5469ef
      APK_NAME: GeneralsZH-Launcher-DayNight-v1.4.7-debug.apk
      VERSION_CODE: '10407'
      VERSION_NAME: '1.4.7'
    steps:
      - name: Ensure source version and stable signed engine update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPO/branches/$BRANCH" --jq '.commit.sha')" = "$SOURCE_SHA"
          gh api "repos/$REPO/contents/manifest.json?ref=updates" --jq '.content' | base64 -d > "$RUNNER_TEMP/engine.json"
          python3 - "$RUNNER_TEMP/engine.json" <<'PY'
          import json,sys
          manifest=json.load(open(sys.argv[1]))
          assert manifest['engine']['seq']==3356
          print('PASS: stable 3356 update remains published')
          PY
      - uses: actions/checkout@v6
        with:
          ref: 20a0b37d7342e8831e03479d8f274aec7c5469ef
          fetch-depth: 1
          filter: blob:none
          submodules: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Android SDK cache (no native compilation)
        id: sdk
        uses: actions/cache/restore@v5
        with:
          path: /opt/android-sdk
          key: android-sdk-13114758-ndk27.2.12479018-p35-bt35
      - name: Install only Java APK packaging SDK if needed
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o "$RUNNER_TEMP/tools.zip" https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          echo "5fdcc763663eefb86a5b8879697aa6088b041e70  $RUNNER_TEMP/tools.zip" | sha1sum -c -
          sudo mkdir -p /opt/android-sdk/cmdline-tools
          sudo unzip -q "$RUNNER_TEMP/tools.zip" -d /opt/android-sdk/cmdline-tools
          sudo mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          sudo chown -R "$USER":"$USER" /opt/android-sdk
          yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download latest verified launcher binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p retained-apk
          gh release download v1.4.6-launcher-progress --repo "$REPO" --pattern '*.apk' --dir retained-apk
          test -s retained-apk/GeneralsZH-LauncherProgress-v1.4.6-debug.apk
      - name: Reuse exactly the signed native libraries and runtime assets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,zipfile,json,pathlib
          apk=pathlib.Path('retained-apk/GeneralsZH-LauncherProgress-v1.4.6-debug.apk')
          expected=json.loads(pathlib.Path('.github/engine-baseline/bootstrap-native.json').read_text())['native_libraries']
          java=pathlib.Path('android/app/src/main')
          names=set()
          with zipfile.ZipFile(apk) as z:
              assert z.read('assets/engine_build.txt').strip()==b'3333'
              assert z.read('assets/update-public.pem')==(java/'assets/update-public.pem').read_bytes()
              for info in z.infolist():
                  name=info.filename
                  if name.startswith('lib/arm64-v8a/') and name.endswith('.so'):
                      lib=name.rsplit('/',1)[-1]
                      data=z.read(info)
                      assert lib in expected and hashlib.sha256(data).hexdigest()==expected[lib]['sha256'],lib
                      dest=java/'jniLibs/arm64-v8a'/lib
                      dest.parent.mkdir(parents=True,exist_ok=True)
                      dest.write_bytes(data)
                      names.add(lib)
                  if name.startswith('assets/') and not info.is_dir():
                      dest=java/name
                      dest.parent.mkdir(parents=True,exist_ok=True)
                      dest.write_bytes(z.read(info))
          assert names==set(expected), 'Native dependency mismatch'
          print('PASS: all 17 native libraries are identical to the stable APK')
          PY
      - name: Stage pinned SDL3 Java bridge only
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o "$RUNNER_TEMP/sdl.tar.gz" https://github.com/libsdl-org/SDL/releases/download/release-3.4.2/SDL3-3.4.2.tar.gz
          echo "ef39a2e3f9a8a78296c40da701967dd1b0d0d6e267e483863ce70f8a03b4050c  $RUNNER_TEMP/sdl.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/sdl"
          tar -xzf "$RUNNER_TEMP/sdl.tar.gz" -C "$RUNNER_TEMP/sdl" --wildcards 'SDL3-3.4.2/android-project/app/src/main/java/org/libsdl/app/*'
          src="$RUNNER_TEMP/sdl/SDL3-3.4.2/android-project/app/src/main/java/org/libsdl/app"
          dest=android/app/src/main/java-sdl/org/libsdl/app
          mkdir -p "$dest"
          cp "$src/"*.java "$dest/"
          patch -p1 -d android/app/src/main/java-sdl < android/patches/sdl-android-gesture-nav-back.patch
      - name: Test theme resources and build Java APK only
        env:
          ANDROID_HOME: /opt/android-sdk
          ANDROID_SDK_ROOT: /opt/android-sdk
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as ET
          base=pathlib.Path('android/app/src/main/res')
          regular=ET.parse(base/'values/colors.xml')
          daylight=ET.parse(base/'values-notnight/colors.xml')
          keys=lambda doc:{x.attrib['name'] for x in doc.findall('.//color')}
          assert keys(regular)==keys(daylight)
          theme=(base/'values/themes.xml').read_text()
          assert 'Theme.GeneralsZHSettingsLight' in theme
          keys=('setup_appearance_title','setup_appearance_system','setup_appearance_light','setup_appearance_dark','setup_appearance_help')
          for strings in base.glob('values*/strings.xml'):
              vals={x.attrib['name'] for x in ET.parse(strings).findall('.//string')}
              assert all(k in vals for k in keys),str(strings)
          print('PASS: full day palette, matching night tokens and 13 localized pickers')
          PY
          # Preserve all native symbols; the existing .so blobs must be unchanged.
          cat >> android/app/build.gradle <<'EOF'
          android {
              packagingOptions {
                  jniLibs { keepDebugSymbols += ['**/*.so'] }
              }
          }
          EOF
          gradle -p android :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace \
             -PandroidVersionCode="$VERSION_CODE" -PandroidVersionName="$VERSION_NAME"
      - name: Audit output signer native libraries and installer identity
        run: |
          set -euo pipefail
          mkdir -p final
          cp android/app/build/outputs/apk/debug/app-debug.apk "final/$APK_NAME"
          python3 - <<'PY'
          import pathlib,zipfile,hashlib,json,os
          a=pathlib.Path('final')/os.environ['APK_NAME']
          baseline=pathlib.Path('retained-apk/GeneralsZH-LauncherProgress-v1.4.6-debug.apk')
          expected=json.loads(pathlib.Path('.github/engine-baseline/bootstrap-native.json').read_text())['native_libraries']
          with zipfile.ZipFile(a) as z,zipfile.ZipFile(baseline) as b:
              native={n.split('/')[-1] for n in z.namelist() if n.startswith('lib/arm64-v8a/') and n.endswith('.so')}
              assert native==set(expected)
              for name,pin in expected.items():
                  assert hashlib.sha256(z.read('lib/arm64-v8a/'+name)).hexdigest()==pin['sha256'],name
              assert z.read('assets/update-public.pem')==b.read('assets/update-public.pem')
              assert z.read('assets/engine_build.txt').strip()==b'3333'
              assert z.read('classes.dex')!=b.read('classes.dex'),'New UI must compile'
          print('PASS: native SHA256, engine bootstrap, update trust root, launcher classes')
          PY
          BT=/opt/android-sdk/build-tools/35.0.0
          "$BT/apksigner" verify --print-certs "final/$APK_NAME" > "$RUNNER_TEMP/new-sig.txt"
          "$BT/apksigner" verify --print-certs retained-apk/GeneralsZH-LauncherProgress-v1.4.6-debug.apk > "$RUNNER_TEMP/old-sig.txt"
          old="$(grep 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/old-sig.txt" | cut -d: -f2 | tr -d ' ')"
          new="$(grep 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/new-sig.txt" | cut -d: -f2 | tr -d ' ')"
          test -n "$old" && test "$old" = "$new"
          "$BT/aapt" dump badging "final/$APK_NAME" | head -1 | tee "$RUNNER_TEMP/identity"
          grep -q "name='com.generalsx.zerohour'" "$RUNNER_TEMP/identity"
          grep -q "versionCode='10407'" "$RUNNER_TEMP/identity"
          echo 'PASS: signing identity matches 1.4.6; in-place update possible'
          sha256sum "final/$APK_NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: GeneralsZH-DayNight-v1.4.7-debug
          path: final/*.apk
          retention-days: 90
          if-no-files-found: error
      - name: Publish opt-in APK with day and night interface
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v1.4.7-launcher-day-night
          ! gh release view "$tag" --repo "$REPO" >/dev/null 2>&1 || { echo 'Release exists; refuse overwrite'; exit 1; }
          cat > "$RUNNER_TEMP/notes.txt" <<'EOF'
          Launcher Day / Night / System appearance. Settings > Interface.
          - Day: bright surfaces with accessible text, Night: retained original dark palette.
          - System: follow Android; last selection persisted after restarts.
          - Applies to Launcher, Mod Manager, Folder Picker, Logs, Online, replay and diagnostics.
          - UI-only. Original engine 3333 bundled; published Engine 3356 remains available via in-app updates.
          - All native binaries, update public key, package identity and debug signer preserved.
          - Real-device visual testing is required. No mod/gameplay fix is claimed.
          Install on top of v1.4.6 without clearing app data.
          EOF
          gh release create "$tag" "final/$APK_NAME" --repo "$REPO" --target "$SOURCE_SHA" \
            --title 'Generals ZH Launcher 1.4.7 — Day/Night Appearance' \
            --notes-file "$RUNNER_TEMP/notes.txt" --latest=false
