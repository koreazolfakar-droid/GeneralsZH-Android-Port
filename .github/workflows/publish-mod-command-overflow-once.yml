# One-time guarded build/publish of CommandSet paging for standalone Project X.
# Triggered by adding this file to dev/mobile-v4; fail closed on any cache/build failure.
# Fail-closed: NEVER publish on failed incremental builds or source mismatch.
name: Publish mod command overflow fix (one time)
on:
  push:
    branches:
      - dev/mobile-v4
    paths:
      - .github/workflows/publish-mod-command-overflow-once.yml
permissions:
  contents: read
  actions: write
jobs:
  guarded-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    concurrency:
      group: mod-command-overflow-engine-release-once
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_PARENT: e56f5ef5d3f671f8ba9960f4e8a6d7f450128782
      EXPECTED_ENGINE_SOURCE: 9f5d3c7e8b38dd00a2b74d5c4520ed9363e6d4f6
      EXPECTED_ENGINE_RUN: '38071407202'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Verify one-time release request and immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev/mobile-v4"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%s HEAD)" = 'ci(update): correct jq PCH-free engine 3402 publish guard [publish-engine-once]'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev/mobile-v4" --jq '.object.sha')" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$EXPECTED_ENGINE_SOURCE" HEAD
          echo "EXPECTED_ENGINE_SEQ=3402" >> "$GITHUB_ENV"
          echo "Publishing immutable engine 3402 from verified build $EXPECTED_ENGINE_RUN ($EXPECTED_ENGINE_SOURCE); no native rebuild"
      - name: Reuse verified successful engine build and invoke signed publisher
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev/mobile-v4" --jq '.object.sha')" = "$GITHUB_SHA" || {
            echo "::error::Branch changed after request"; exit 1;
          }
          # Verify the immutable older run directly by run metadata, not by the
          # cross-run artifacts listing endpoint (which returned HTTP 404).
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EXPECTED_ENGINE_RUN" --jq \
            '[(.id | tostring), .status, .conclusion, .head_sha, .path, .head_repository.full_name] | join("|")' \
            | grep -Fx "$EXPECTED_ENGINE_RUN|completed|success|$EXPECTED_ENGINE_SOURCE|.github/workflows/build-android.yml|$GITHUB_REPOSITORY"
          previous_sign="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/sign-update.yml/runs?per_page=50&branch=dev%2Fmobile-v4&event=workflow_dispatch" \
            --jq '[.workflow_runs[].id] | max // 0')"
          gh workflow run sign-update.yml --ref dev/mobile-v4 \
            -f public_identity_only=false \
            -f engine_build_run="$EXPECTED_ENGINE_RUN" \
            -f engine_source_commit="$EXPECTED_ENGINE_SOURCE" \
            -f note='Expose Project X Remastered mod build and production commands in slots 15-18 on mobile; preserve vanilla, saves, network, 30/60Hz and mod isolation.'
          for ((n=1;n<=100;n++)); do
            sign_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/sign-update.yml/runs?per_page=50&branch=dev%2Fmobile-v4&event=workflow_dispatch" \
              --jq ".workflow_runs | map(select(.id > $previous_sign and .head_sha == \"$GITHUB_SHA\")) | max_by(.id).id // empty")"
            if [[ "$sign_run" =~ ^[0-9]+$ ]]; then
              state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$sign_run" \
                --jq '[.status, (.conclusion // "pending")] | join(" ")')"
              echo "Signed publish run $sign_run: $state"
              if [[ "$state" == "completed success" ]]; then
                echo "PASS: source-pinned update signed and published by run $sign_run"
                break
              fi
              if [[ "$state" == completed* ]]; then
                echo "::error::Signing/publishing failed: $state"
                exit 1
              fi
            fi
            if (( n == 100 )); then echo "::error::Signed publish timed out"; exit 1; fi
            sleep 30
          done
      - name: Verify exact public update points to this source and dual-engine payloads
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/contents/manifest.json?ref=updates" --jq '.content' | base64 --decode > /tmp/engine-manifest.json
          gh api "repos/$GITHUB_REPOSITORY/contents/manifest.json.sig?ref=updates" --jq '.content' | base64 --decode > /tmp/engine-manifest.json.sig
          test -s /tmp/engine-manifest.json.sig
          python3 - <<'PY'
          import json, os
          data = json.load(open('/tmp/engine-manifest.json'))
          engine = data['engine']
          assert engine['source_commit'] == os.environ['EXPECTED_ENGINE_SOURCE'], (engine['source_commit'], os.environ['EXPECTED_ENGINE_SOURCE'])
          assert engine['seq'] == int(os.environ['EXPECTED_ENGINE_SEQ'])
          assert {'libmain.so', 'libmain60.so'} <= set(engine['files'])
          for key in ('libmain.so', 'libmain60.so'):
              entry = engine['files'][key]
              assert entry['sha256'] and entry['size'] > 0
              assert entry['url'].startswith('https://raw.githubusercontent.com/')
          print('PASS: published signed engine', engine['seq'], 'source', engine['source_commit'])
          PY
          echo "Update channel now contains both variants, matching this exact commit."
