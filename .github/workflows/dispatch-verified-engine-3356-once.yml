name: Dispatch verified Engine 3356 update once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-verified-engine-3356-once.yml'
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    if: github.repository == 'koreazolfakar-droid/GeneralsZH-Android-Port'
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact source and successful engine report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO='koreazolfakar-droid/GeneralsZH-Android-Port'
          EXPECTED='308153f6e1f3af1539d9211d15750027b4d1ba7c'
          actual="$(gh api "repos/$REPO/branches/dev/mobile-v4" --jq '.commit.sha')"
          test "$actual" = "$EXPECTED" || { echo 'Source SHA changed; do not publish stale engine'; exit 1; }
          status="$(gh api "repos/$REPO/actions/runs/38032866006" --jq '.conclusion')"
          test "$status" = 'success' || { echo 'Engine build not successful'; exit 1; }
          gh workflow run sign-update.yml --repo "$REPO" --ref dev/mobile-v4 \
            -f public_identity_only=false \
            -f engine_build_run=38032866006 \
            -f note='Fix standalone mod BIG mounting priority and nested archive scanning; validated dual-engine build 3356. Android device gameplay test pending.'
          echo 'Submitted existing guarded engine signing and publishing workflow.'
