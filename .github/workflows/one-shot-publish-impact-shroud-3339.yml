name: One-shot publish impact shroud engine 3339

on:
  push:
    branches:
      - ops/publish-impact-shroud-3339
    paths:
      - '.github/workflows/one-shot-publish-impact-shroud-3339.yml'

permissions:
  contents: read
  actions: write

jobs:
  build-prepare-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_COMMIT: 7f65f31c7338ef6967fa7194cfb21af6bf9e5467
      RELEASE_NOTE: "Impact shroud reveal: projectile/artillery impacts temporarily reveal the blast area in single-player. Multiplayer shroud behavior is unchanged."
    steps:
      - name: Checkout exact engine source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          filter: blob:none

      - name: Verify engine sequence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse --is-shallow-repository)" = false
          seq="$(bash scripts/build/android/engine-build-number.sh "$PWD")"
          test "$seq" = 3339
          echo "Verified Engine Build $seq from $SOURCE_COMMIT"

      - name: Dispatch incremental Android build
        id: dispatch_build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run build-android.yml             --repo "$GITHUB_REPOSITORY"             --ref dev/mobile-v4             -f source_ref="$SOURCE_COMMIT"             -f require_existing_caches=false             -f restore_protected_history=false             -f restore_validation_layer=false             -f verify_apk_run=             -f create_release=false

          for i in $(seq 1 40); do
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-android.yml/runs?branch=dev%2Fmobile-v4&event=workflow_dispatch&head_sha=$SOURCE_COMMIT&per_page=10" --jq '.workflow_runs[0].id // empty')"
            if [ -n "$run_id" ]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "Build run: $run_id"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Could not resolve dispatched Build Android run"
          exit 1

      - name: Wait for incremental build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ steps.dispatch_build.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 360); do
            read -r status conclusion < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq '[.status, (.conclusion // "")] | @tsv')
            echo "Build status=$status conclusion=$conclusion"
            if [ "$status" = completed ]; then
              test "$conclusion" = success
              exit 0
            fi
            sleep 15
          done
          echo "::error::Build did not complete within workflow timeout window"
          exit 1

      - name: Download built APK
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ steps.dispatch_build.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-artifact
          gh run download "$BUILD_RUN"             --repo "$GITHUB_REPOSITORY"             --pattern 'GeneralsXZH-android-run*.apk'             --dir build-artifact
          APK="$(find build-artifact -type f -name '*.apk' | head -1)"
          test -n "$APK" -a -s "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Prepare verified engine update
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update/publish-update.py             --apk "$APK"             --out prepared-update             --note "$RELEASE_NOTE"
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('prepared-update/manifest.json').read_text())
          assert m['engine']['seq'] == 3339, m['engine']['seq']
          assert m['engine']['source_commit'] == '7f65f31c7338ef6967fa7194cfb21af6bf9e5467'
          print('Prepared Engine',m['engine']['seq'],'serial',m['serial'])
          PY

      - name: Upload prepared engine update
        uses: actions/upload-artifact@v7
        with:
          name: prepared-engine-update
          path: prepared-update/
          if-no-files-found: error
          retention-days: 7

      - name: Dispatch signing and publication
        id: dispatch_sign
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run sign-update.yml             --repo "$GITHUB_REPOSITORY"             --ref dev/mobile-v4             -f public_identity_only=false             -f prepared_run="$GITHUB_RUN_ID"             -f note="$RELEASE_NOTE"

          for i in $(seq 1 40); do
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/sign-update.yml/runs?branch=dev%2Fmobile-v4&event=workflow_dispatch&head_sha=$SOURCE_COMMIT&per_page=10" --jq '.workflow_runs[0].id // empty')"
            if [ -n "$run_id" ]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "Sign/publish run: $run_id"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Could not resolve Sign update run"
          exit 1

      - name: Wait for signing and publication
        env:
          GH_TOKEN: ${{ github.token }}
          SIGN_RUN: ${{ steps.dispatch_sign.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            read -r status conclusion < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SIGN_RUN" --jq '[.status, (.conclusion // "")] | @tsv')
            echo "Sign status=$status conclusion=$conclusion"
            if [ "$status" = completed ]; then
              test "$conclusion" = success
              exit 0
            fi
            sleep 10
          done
          echo "::error::Signing/publication did not finish successfully"
          exit 1

      - name: Verify published manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/contents/manifest.json?ref=updates"             --jq .content | tr -d '\n' | base64 -d > /tmp/published-manifest.json
          python3 - <<'PY'
          import json
          m=json.load(open('/tmp/published-manifest.json'))
          assert m['engine']['seq'] == 3339, m['engine']['seq']
          assert m['engine']['source_commit'] == '7f65f31c7338ef6967fa7194cfb21af6bf9e5467'
          print('PASS: published Engine Build 3339')
          PY
