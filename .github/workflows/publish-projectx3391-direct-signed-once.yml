# GeneralsX @build Codex 10/10/2026 Reuse the registered signer with exact build/source inputs.
name: Publish signed Project X Engine 3391 (verified)
on:
  push:
    branches: [release/sign-projectx-engine3391-20261010]
    paths: [.github/workflows/publish-projectx3391-direct-signed-once.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: own-engine-update-publish
  cancel-in-progress: false
jobs:
  sign-publish-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ENGINE_RUN: '38051407506'
      SOURCE_COMMIT: 'a4c0ed742e4d2d00ceb2fbba1dd5b3948edca368'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          filter: blob:none
          clean: false
      - name: Require exact current mobile source and successful native run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/release/sign-projectx-engine3391-20261010'
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev/mobile-v4" --jq .object.sha)" = "$SOURCE_COMMIT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ENGINE_RUN" --jq .conclusion)" = success
          echo "Real complete-history engine sequence: $(bash scripts/build/android/engine-build-number.sh "$PWD")"
      - uses: actions/download-artifact@v5
        with:
          name: engine-incremental-report
          run-id: ${{ env.ENGINE_RUN }}
          github-token: ${{ github.token }}
          path: engine-build
      - uses: actions/download-artifact@v5
        with:
          name: Bootstrap-1.4.3-Engine3333-debug.apk
          run-id: 37422581004
          github-token: ${{ github.token }}
          path: bootstrap-baseline
      - name: Prepare verified dual-engine update and dependency requirements
        run: |
          python3 scripts/update/prepare-engine-run.py \
            --report-dir engine-build \
            --baseline-apk bootstrap-baseline/GeneralsZH-Bootstrap-1.4.3-Engine3333-debug.apk \
            --expected-source "$SOURCE_COMMIT" \
            --out prepared-update \
            --note 'Fix standalone Project X mod loading order before GameData.ini. Both 30Hz and 60Hz engines built incrementally and verified with SHA-256 and signed manifest; preserved original APK, vanilla, saves and networking. Real device gameplay verification remains pending.'
      - uses: actions/upload-artifact@v7
        with:
          name: prepared-engine-update
          path: prepared-update/
          if-no-files-found: error
          retention-days: 90
      - name: Sign and verify exact manifest and engine payloads
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: bash scripts/update/sign-manifest.sh prepared-update
      - name: Publish verified signed update preserving previous engines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git --hostname github.com
          bash scripts/update/push-updates-branch.sh prepared-update
      - name: Verify published manifest and both payload URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,importlib.util,json,os,pathlib,subprocess,urllib.request,gzip
          spec=importlib.util.spec_from_file_location('artifacts','scripts/update/update-artifacts.py')
          a=importlib.util.module_from_spec(spec);spec.loader.exec_module(a)
          repo=os.environ['GITHUB_REPOSITORY']
          api=lambda p:json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/'+p]))
          head=api('git/ref/heads/updates')['object']['sha']
          directory=pathlib.Path('published-verification');directory.mkdir()
          for name in ('manifest.json','manifest.json.sig'):
              (directory/name).write_bytes(base64.b64decode(api(f'contents/{name}?ref={head}')['content']))
          manifest=a.verify_manifest(directory,'android/app/src/main/assets/update-public.pem')
          sequence=int(subprocess.check_output(['bash','scripts/build/android/engine-build-number.sh',os.getcwd()]))
          assert manifest['engine']['seq']==sequence
          assert manifest['engine']['source_commit']==os.environ['SOURCE_COMMIT']
          for name,row in manifest['engine']['files'].items():
              relative=f'engine/{sequence}/{name}.gz'
              assert row['url']==a.BASE_URL+relative
              with urllib.request.urlopen(row['url'],timeout=90) as response:compressed=response.read()
              target=directory/relative;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(compressed)
              data=gzip.decompress(compressed)
              assert len(data)==row['size'] and hashlib.sha256(data).hexdigest()==row['sha256']
              a.native_stamp(data,os.environ['SOURCE_COMMIT'],sequence)
          a.verify_directory(directory,'android/app/src/main/assets/update-public.pem')
          print('PASS: published signed dual-engine sequence',sequence,'source',os.environ['SOURCE_COMMIT'])
          PY
