# GeneralsX @feature Codex 06/10/2026 Our signed channel: validate before publication, private key in Actions secret only.
name: Sign update
on:
  workflow_dispatch:
    inputs:
      public_identity_only:
        description: 'Derive PUBLIC key only; do not sign or publish an update'
        required: true
        default: true
        type: boolean
      prepared_run:
        description: 'Actions run containing a prepared-engine-update artifact; empty for settings only'
        required: false
        type: string
      engine_build_run:
        description: 'Successful engine-incremental-report run to prepare, sign and publish; do not combine with prepared_run'
        required: false
        type: string
      engine_source_commit:
        description: 'Optional exact source SHA of a prior successful engine build; prevents rebuilding just to publish'
        required: false
        type: string
      note:
        description: 'Release note'
        required: false
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: own-engine-update-publish
  cancel-in-progress: false
jobs:
  public-identity:
    if: github.repository == 'koreazolfakar-droid/GeneralsZH-Android-Port' && inputs.public_identity_only
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Export public-only identity from Actions secret
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          set +x
          test -n "$UPDATE_SIGNING_KEY" || { echo 'UPDATE_SIGNING_KEY is not configured'; exit 1; }
          umask 077
          mkdir public-identity
          key="$RUNNER_TEMP/update-private.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          unset UPDATE_SIGNING_KEY
          openssl pkey -in "$key" -pubout -out public-identity/update-public.pem
          openssl pkey -pubin -in public-identity/update-public.pem -text -noout | grep -q 'prime256v1'
      - uses: actions/upload-artifact@v7
        with:
          name: own-update-public-identity
          path: public-identity/update-public.pem
          if-no-files-found: error
          retention-days: 7
  sign:
    if: github.repository == 'koreazolfakar-droid/GeneralsZH-Android-Port' && !inputs.public_identity_only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.engine_source_commit || 'dev/mobile-v4' }}
          fetch-depth: 0
          filter: blob:none
      - name: Verify exact successful build source before artifact download
        if: inputs.engine_build_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_RUN: ${{ inputs.engine_build_run }}
          PINNED_SOURCE: ${{ inputs.engine_source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ENGINE_RUN" =~ ^[0-9]+$ ]] || { echo "::error::Invalid engine build run"; exit 1; }
          if [[ -n "$PINNED_SOURCE" ]]; then
            [[ "$PINNED_SOURCE" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid immutable source SHA"; exit 1; }
          fi
          test "$(git rev-parse HEAD)" = "${PINNED_SOURCE:-$(git rev-parse HEAD)}"
          metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ENGINE_RUN")"
          echo "$metadata" | python3 -c '
          import json, sys, os, subprocess
          r=json.load(sys.stdin)
          source=subprocess.check_output(["git","rev-parse","HEAD"], text=True).strip()
          assert r["status"] == "completed" and r["conclusion"] == "success", "Engine build not successful"
          assert r["head_sha"] == source, "Engine run source differs from checked out immutable source"
          assert r["event"] == "workflow_dispatch", "Engine run was not an explicit verified dispatch"
          assert r["path"] == ".github/workflows/build-android.yml", "Not an engine build workflow"
          assert r["head_repository"]["full_name"] == os.environ["GITHUB_REPOSITORY"], "Cross-repository build forbidden"
          print("PASS: verified immutable engine build source", source, "run", r["id"])
          '
      - name: Reject ambiguous publication input
        env:
          ENGINE_RUN: ${{ inputs.engine_build_run }}
          PREPARED_RUN: ${{ inputs.prepared_run }}
        run: |
          test -z "$ENGINE_RUN" || test -z "$PREPARED_RUN"
      - uses: actions/download-artifact@v5
        if: inputs.engine_build_run != ''
        with:
          name: engine-incremental-report
          run-id: ${{ inputs.engine_build_run }}
          github-token: ${{ github.token }}
          path: engine-build
      - uses: actions/download-artifact@v5
        if: inputs.engine_build_run != ''
        with:
          name: Bootstrap-1.4.3-Engine3333-debug.apk
          run-id: 37422581004
          github-token: ${{ github.token }}
          path: bootstrap-baseline
      - name: Prepare exact verified incremental engine pair
        if: inputs.engine_build_run != ''
        env:
          UPDATE_NOTE: ${{ inputs.note }}
        run: |
          python3 scripts/update/prepare-engine-run.py \
            --report-dir engine-build \
            --baseline-apk bootstrap-baseline/GeneralsZH-Bootstrap-1.4.3-Engine3333-debug.apk \
            --expected-source "$(git rev-parse HEAD)" \
            --out prepared-update --note "$UPDATE_NOTE"
      - uses: actions/upload-artifact@v7
        if: inputs.engine_build_run != ''
        with:
          name: prepared-engine-update
          path: prepared-update/
          if-no-files-found: error
          retention-days: 90
      - name: Require pinned own public identity
        run: test -f android/app/src/main/assets/update-public.pem
      - uses: actions/download-artifact@v5
        if: inputs.prepared_run != ''
        with:
          name: prepared-engine-update
          run-id: ${{ inputs.prepared_run }}
          github-token: ${{ github.token }}
          path: prepared-update
      - name: Prepare settings only
        if: inputs.prepared_run == '' && inputs.engine_build_run == ''
        env:
          UPDATE_NOTE: ${{ inputs.note }}
        run: python3 scripts/update/publish-update.py --out prepared-update --note "$UPDATE_NOTE"
      - name: Sign and verify exact manifest bytes and binaries
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: bash scripts/update/sign-manifest.sh prepared-update
      - name: Publish signed update
        env:
          GH_TOKEN: ${{ github.token }}
        # The publisher creates a separate temporary Git repository. Checkout's
        # repository-local credential does not apply to that publication tree.
        run: |
          gh auth setup-git --hostname github.com
          bash scripts/update/push-updates-branch.sh prepared-update
