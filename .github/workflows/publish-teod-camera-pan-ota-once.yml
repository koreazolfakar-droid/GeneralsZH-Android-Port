# Fail-closed release: signed engine-only OTA for localized terrain updates PR #37; no APK publish.
# All libraries must be produced by the existing dual 30/60Hz incremental builder.
name: Publish localized terrain-height engine OTA (one time)
on:
  push:
    branches: [dev/mobile-v4]
    paths: [.github/workflows/publish-teod-camera-pan-ota-once.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: own-engine-update-publish
  cancel-in-progress: false
jobs:
  checked-dual-engine-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_MERGE: 118eab639ec02a6e052787e430421cd6524f7a11
      PRIOR_ENGINE: '3637'
      PRIOR_SERIAL: '28'
      PRIOR_SOURCE: 92345defa6e917947136737c63711db8f675b34d
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Verify pinned merged PR and immutable change scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/dev/mobile-v4
          test "$(git rev-parse --is-shallow-repository)" = false
          test "$(git rev-parse HEAD^1)" = "$BASE_MERGE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%s HEAD)" = '[engine-ota-only] publish: localized terrain height OTA retest (#38)'
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev/mobile-v4" --jq .object.sha)" = "$GITHUB_SHA"
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/38")"
          # Guard both the original PR #37 engine fix and this PR #38 QA adapter.
          prior_pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/37")"
          test "$(jq -r .merged <<< "$prior_pr")" = true
          test "$(jq -r .merge_commit_sha <<< "$prior_pr")" = db322297fe206a7d5dbb1876988fba5fc96969cd
          test "$(jq -r .merged <<< "$pr")" = true
          test "$(jq -r .merge_commit_sha <<< "$pr")" = "$BASE_MERGE"
          test "$(jq -r .head.ref <<< "$pr")" = fix/teod-prertt-qa-fixture-20261102
          test "$(git show HEAD:.github/workflows/build-android.yml | grep -c '\[engine-ota-only\]')" = 1
          # This controller must be the only post-merge change; never override source fixes.
          actual="$(git diff --name-only "$BASE_MERGE" HEAD)"
          test "$actual" = '.github/workflows/publish-teod-camera-pan-ota-once.yml' || {
            echo 'Refusing OTA: source changes or concurrent commits detected'
            exit 1
          }
          test "$(git rev-list --count HEAD)" -gt "$PRIOR_ENGINE"
          git diff --check 92345defa6e917947136737c63711db8f675b34d HEAD
      - name: Verify TEOD terrain-locality and existing engine regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/qa/test-large-battle-client-scale.py
          python3 scripts/qa/test-upstream-142-port.py
          python3 scripts/qa/test-teod-camera-scroll.py
          python3 scripts/qa/test-shader-cache-async.py
          python3 scripts/qa/test-shroud-dirty-rect.py
          python3 scripts/qa/test-volume-particle-equivalence.py
          python3 scripts/qa/test-gles-upload-regressions.py
          python3 scripts/qa/test-engine-security.py
          python3 scripts/qa/test-vehicle-ai-v1.py
      - name: Confirm previous signed OTA is intact
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/contents/manifest.json?ref=updates" --jq .content | base64 --decode > "$RUNNER_TEMP/prior-manifest.json"
          mkdir -p prior-check
          cp "$RUNNER_TEMP/prior-manifest.json" prior-check/manifest.json
          gh api "repos/$GITHUB_REPOSITORY/contents/manifest.json.sig?ref=updates" --jq .content | base64 --decode > prior-check/manifest.json.sig
          python3 - <<'PY'
          import os,json,importlib.util
          spec=importlib.util.spec_from_file_location('artifacts','scripts/update/update-artifacts.py')
          a=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(a)
          p=a.verify_manifest('prior-check','android/app/src/main/assets/update-public.pem')
          assert p['channel']=='koreazolfakar-droid/mobile-v4/v1'
          assert p['engine']['seq']==int(os.environ['PRIOR_ENGINE'])
          assert p['serial']==int(os.environ['PRIOR_SERIAL'])
          assert p['engine']['source_commit']==os.environ['PRIOR_SOURCE']
          assert set(p['engine']['files'])=={'libmain.so','libmain60.so'}
          print('PASS: unmodified signed OTA baseline',p['engine']['seq'])
          PY
      - name: Dispatch cache-backed 30Hz and 60Hz engine build
        shell: bash
        run: |
          set -euo pipefail
          prev="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-android.yml/runs?per_page=50&event=workflow_dispatch" --jq '[.workflow_runs[].id] | max // 0')"
          echo "PREVIOUS_NATIVE_RUN=$prev" >> "$GITHUB_ENV"
          gh workflow run build-android.yml --ref dev/mobile-v4 \
            -f engine_incremental_mode=build \
            -f source_ref="$GITHUB_SHA" \
            -f require_existing_caches=true
      - name: Verify completed immutable dual-engine build
        shell: bash
        run: |
          set -euo pipefail
          for ((attempt=1;attempt<=250;attempt++)); do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-android.yml/runs?per_page=50&event=workflow_dispatch" \
              --jq ".workflow_runs | map(select(.id > $PREVIOUS_NATIVE_RUN and .head_sha == \"$GITHUB_SHA\")) | max_by(.id).id // empty")"
            if [[ "$run" =~ ^[0-9]+$ ]]; then
              result="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '[.status,(.conclusion // "pending"),.head_sha,.event,.path] | join("|")')"
              echo "native build $run: $result"
              if [[ "$result" == "completed|success|$GITHUB_SHA|workflow_dispatch|.github/workflows/build-android.yml" ]]; then
                # Verify this was the incremental native job, not an APK-only success.
                jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100")"
                test "$(jq -r '[.jobs[] | select(.name == "engine-incremental" and .conclusion == "success")] | length' <<< "$jobs")" = 1
                test "$(jq -r '[.jobs[] | select((.name | startswith("apk@")) and .conclusion != "skipped")] | length' <<< "$jobs")" = 0
                echo "NATIVE_RUN=$run" >> "$GITHUB_ENV"
                exit 0
              fi
              if [[ "$result" == completed\|* ]]; then echo 'Native build failed; no OTA published'; exit 1; fi
            fi
            sleep 20
          done
          echo 'Native build timed out; no OTA published'
          exit 1
      - uses: actions/download-artifact@v5
        with:
          name: engine-incremental-report
          run-id: ${{ env.NATIVE_RUN }}
          github-token: ${{ github.token }}
          path: engine-build
      - uses: actions/download-artifact@v5
        with:
          name: Bootstrap-1.4.3-Engine3333-debug.apk
          run-id: 37422581004
          github-token: ${{ github.token }}
          path: bootstrap-baseline
      - name: Prepare and verify signed-channel compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update/prepare-engine-run.py \
            --report-dir engine-build \
            --baseline-apk bootstrap-baseline/GeneralsZH-Bootstrap-1.4.3-Engine3333-debug.apk \
            --expected-source "$GITHUB_SHA" \
            --out prepared-update \
            --serial 29 \
            --note 'TEOD terrain CPU optimization: batch local height-cell dirty rectangles and reuse partial update for changed terrain cells instead of forcing full vertex rebuild after every terrain lowering event. Preserve normal halos, alpha/shoreline, scorch/road/bridge invalidation and full relight on time-of-day/device reset. TEOD and source-level regression tests passed; actual mobile FPS gain must be measured. Dual 30/60Hz engine-only OTA, no APK, gameplay protocol or mod changes.'
          python3 - <<'PY'
          import json,os
          m=json.load(open('prepared-update/manifest.json'))
          r=json.load(open('engine-build/result.json'))
          assert r['build']=='PASS' and r['new_apk_required'] is False
          assert m['engine']['source_commit']==os.environ['GITHUB_SHA']
          assert m['engine']['seq']>int(os.environ['PRIOR_ENGINE'])
          assert m['serial']==int(os.environ['PRIOR_SERIAL'])+1
          assert set(m['engine']['files'])=={'libmain.so','libmain60.so'}
          print('PASS: candidate native OTA engine',m['engine']['seq'],'serial',m['serial'])
          PY
      - name: Prevent concurrent OTA manifest overwrite
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/contents/manifest.json?ref=updates" --jq .content | base64 --decode > "$RUNNER_TEMP/pre-sign-manifest.json"
          cmp "$RUNNER_TEMP/prior-manifest.json" "$RUNNER_TEMP/pre-sign-manifest.json"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev/mobile-v4" --jq .object.sha)" = "$GITHUB_SHA"
      - name: Sign with existing secret and verify local payload
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          bash scripts/update/sign-manifest.sh prepared-update
      - name: Publish to existing signed updates branch
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git --hostname github.com
          bash scripts/update/push-updates-branch.sh prepared-update
      - name: Verify public manifest signature and immutable dual-engine downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published-check
          for file in manifest.json manifest.json.sig; do
            gh api "repos/$GITHUB_REPOSITORY/contents/$file?ref=updates" --jq .content | base64 --decode > "published-check/$file"
          done
          python3 - <<'PY'
          import hashlib,importlib.util,gzip,json,os,pathlib,urllib.request,time
          spec=importlib.util.spec_from_file_location('artifacts','scripts/update/update-artifacts.py')
          a=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(a)
          m=a.verify_manifest('published-check','android/app/src/main/assets/update-public.pem')
          assert m['engine']['source_commit']==os.environ['GITHUB_SHA']
          assert m['engine']['seq']>int(os.environ['PRIOR_ENGINE'])
          assert m['serial']==int(os.environ['PRIOR_SERIAL'])+1
          assert set(m['engine']['files'])=={'libmain.so','libmain60.so'}
          for name,row in m['engine']['files'].items():
            url=row['url']
            assert url==a.BASE_URL+f"engine/{m['engine']['seq']}/{name}.gz"
            for attempt in range(5):
              try:
                with urllib.request.urlopen(url,timeout=90) as response:
                  content=gzip.decompress(response.read())
                break
              except Exception:
                if attempt==4: raise
                time.sleep(6)
            assert len(content)==row['size']
            assert hashlib.sha256(content).hexdigest()==row['sha256']
            a.native_stamp(content,os.environ['GITHUB_SHA'],m['engine']['seq'])
          print('PASS: published verified signed engine',m['engine']['seq'],'serial',m['serial'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write(f"### VERIFIED SIGNED ENGINE OTA PUBLISHED\\nSequence {m['engine']['seq']}, serial {m['serial']}, source {os.environ['GITHUB_SHA']}\\n")
          PY
